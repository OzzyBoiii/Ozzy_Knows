<!DOCTYPE html>
<html>

  <head>
    <title>Page 2</title>
  </head>

  <body>
    <div id="content2">Loading text...</div>

    <script>
      fetch('data.txt')
        .then(response => response.text())
        .then(data => {
          const sections = data.split('###TEXT2###');
          const text2 = sections[1].trim();
          document.getElementById('content2').textContent = text2;
        });
    </script>
  </body>

</html>
