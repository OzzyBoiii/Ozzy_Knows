<!DOCTYPE html>
<html>
  <head>
    <title>LOL</title>
    <style>
      /* GLOBAL STYLE */
        /* GLOBAL STYLE */
        /* GLOBAL STYLE */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Asap", sans-serif;
        }

        section {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* FLEXIBLE WEBSITE */
        /* FLEXIBLE WEBSITE */
        /* FLEXIBLE WEBSITE */
        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* BACKGROUND (SPOREDNI PREDMET) */
        /* BACKGROUND (SPOREDNI PREDMET) */
        /* BACKGROUND (SPOREDNI PREDMET) */
        body {
            margin: 0;
            height: 100vh;
            font-weight: 100;
            background: radial-gradient(#a23982, #1f1013);
            animation: fadeIn 1s ease-out;
        }
        
        .light {
            position: absolute;
            width: 0px;
            opacity: 0.75;
            background-color: white;
            box-shadow: #e9f1f1 0px 0px 20px 2px;
            opacity: 0;
            top: 100vh;
            bottom: 0px;
            left: 0px;
            right: 0px;
            margin: auto;
        }
        
        .x1 { animation: floatUp 4s infinite linear; transform: scale(1); }
        .x2 { animation: floatUp 7s infinite linear; transform: scale(1.6); left: 15%; }
        .x3 { animation: floatUp 2.5s infinite linear; transform: scale(0.5); left: -15%; }
        .x4 { animation: floatUp 4.5s infinite linear; transform: scale(1.2); left: -34%; }
        .x5 { animation: floatUp 8s infinite linear; transform: scale(2.2); left: -57%; }
        .x6 { animation: floatUp 3s infinite linear; transform: scale(0.8); left: -81%; }
        .x7 { animation: floatUp 5.3s infinite linear; transform: scale(3.2); left: 37%; }
        .x8 { animation: floatUp 4.7s infinite linear; transform: scale(1.7); left: 62%; }
        .x9 { animation: floatUp 4.1s infinite linear; transform: scale(0.9); left: 85%; }
        
        @keyframes floatUp {
            0% { top: 100vh; opacity: 0; }
            25% { opacity: 1; }
            50% { top: 0vh; opacity: 0.8; }
            75% { opacity: 1; }
            100% { top: -100vh; opacity: 0; }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        /*  */
        button {
          display:grid;
            animation: shimmer 1.5s ease infinite alternate;
            background: linear-gradient(90deg, #ffe27d 0%, #64e3ff 30%, #9192ff 85%);
            background-size: 200% 100%;
            border: none;
            border-radius: 6px;
            box-shadow: -2px -2px 10px rgba(255, 227, 126, 0.5), 2px 2px 10px rgba(144, 148, 255, 0.5);
            color: #170f1e;
            cursor: pointer;
            font-family: "Inter", sans-serif;
            font-size: 14px;
            font-weight: 670;
            line-height: 1.2;
            padding: 8px 12px;
            text-decoration: none;
            transition: 0.2s;
            white-space: nowrap;
            margin: 10px;
        }
        
        button:hover { transform: rotate(-3deg); }
        button:active { transform: scale(0.95) rotate(-3deg); }
        
        @keyframes shimmer {
            to { background-size: 100% 100%; box-shadow: -2px -2px 6px rgba(255, 227, 126, 0.5), 2px 2px 6px rgba(144, 148, 255, 0.5); }
        }

        /* SCROLLING ANIMATION */
        /* SCROLLING ANIMATION */
        /* SCROLLING ANIMATION */
        .reveal {
            position: relative;
            opacity: 0;
        }
        
        .reveal.active {
            opacity: 1;
        }
        
        .active.fade-bottom {
            animation: fade-bottom 1s ease-in;
        }
        
        .active.fade-left {
            animation: fade-left 1s ease-in;
        }
        
        .active.fade-right {
            animation: fade-right 1s ease-in;
        }
        
        @keyframes fade-bottom {
            0% {
                transform: translateY(50px);
                opacity: 0;
            }
            100% {
                transform: translateY(0);
                opacity: 1;
            }
        }
        
        @keyframes fade-left {
            0% {
                transform: translateX(-100px);
                opacity: 0;
            }
            100% {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        @keyframes fade-right {
            0% {
                transform: translateX(100px);
                opacity: 0;
            }
            100% {
                transform: translateX(0);
                opacity: 1;
            }
        }
    </style>
  </head>
  <body>
    <div class="light x1"></div>
    <div class="light x2"></div>
    <div class="light x3"></div>
    <div class="light x4"></div>
    <div class="light x5"></div>
    <div class="light x6"></div>
    <div class="light x7"></div>
    <div class="light x8"></div>
    <div class="light x9"></div>
    <button id="button-87">LOL</button>
  </body>
</html>
