<!DOCTYPE html>
<html>
  <head>
    <title>Sliding text</title>
    <style>
      html,
      body {
        padding: 0;
        margin: 0;
        height: 100%;
      }

      .marquee-w {
        position: relative;
        display: block;
        width: 750px;
        height: 140px;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        overflow: hidden;
      }
      .marquee {
        position: absolute;
        display: block;
        margin: auto auto;
        white-space: nowrap;
        overflow: hidden;
        min-width: 100%;
        height: 100%;
      }
      .marquee span {
        display: inline-block;
        padding-left: 100%;
        font-family: "poppinsbold";
        text-align: center;
        -webkit-text-stroke: 1px #43e486;
        white-space: nowrap;
        min-width: 100%;
        height: 100%;
        line-height: 140px;
        font-size: 85px;
        animation: marquee 10s linear infinite;
      }
      .marquee2 span {
        animation-delay: 5s;
      }
      @keyframes marquee {
        0% {
          transform: translate(0, 0);
        }
        100% {
          transform: translate(-100%, 0);
        }
      }
    </style>
  </head>

  <body>
    <div class="marquee-w">
      <div class="marquee">
        <span
          >This is an infinitely sliding text example&nbsp;&nbsp;&nbsp;</span
        >
      </div>
      <div class="marquee marquee2">
        <span
          >This is an infinitely sliding text example&nbsp;&nbsp;&nbsp;</span
        >
      </div>
    </div>
  </body>
</html>
