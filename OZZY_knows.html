<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grid Layout Example</title>
  <style>
    /* General Styles */
    body {
      background-image: url(Learning.jpg);
      background-repeat: repeat;
      background-attachment: fixed;
      background-size: 20% 60%;
      color: darkgreen;
      text-align: center;
      font-style: italic;
      scroll-behavior: smooth;
      overflow-x: hidden;
      margin: 0;
      padding: 0;
    }

    /* Grid Containers */
    .quotes-grid-container {
      display: grid;
      grid-template-columns: 80% 20%;
      gap: 10px;
      margin-bottom: 20px;
    }

    #quotes-grid-container_2 {
      display: grid;
      grid-template-columns: 20% 80%;
      gap: 10px;
      margin-bottom: 20px;
    }

    /* Quote Items */
    .quotes-item {
      background-color: lightblue;
      padding: 20px;
      border: 1px solid darkblue;
      text-align: center;
      min-height: 80px;
    }

    /* Button Items */
    .button-item {
      background-color: lightcoral;
      padding: 10px;
      border: 1px solid darkred;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Images Grid */
    .photo-grid-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr); /* 3 columns */
      gap: 10px; /* Space between items */
      margin-bottom: 20px;
    }

    .photo-item {
      background-color: lightgreen;
      padding: 10px;
      border: 1px solid darkgreen;
      text-align: center;
    }

    .photo-item img {
      max-width: 100%;
      height: auto;
      display: block;
    }

    /* New Windows */
    .new-window {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 400px;
      height: 300px;
      background-color: white;
      border: 1px solid black;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      display: none;
      padding: 20px;
      text-align: center;
    }

    .new-window.visible {
      display: block;
    }

    /* Stopwatch Styles */
    #Timer_1 {
      font-family: "Courier Prime", monospace;
      font-size: 48px;
      margin: 20px 0;
    }

    .stopwatch-buttons {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .stopwatch-buttons img {
      width: 50px;
      height: 50px;
      cursor: pointer;
    }

    /* Buttons */
    #Button_1,
    #Button_3 {
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      width: 50px;
      height: 50px;
      border: 0;
      cursor: pointer;
    }

    #Button_1 {
      background-image: url(Testing/settings-logo-clipart-2.png);
    }

    #Button_3 {
      background-image: url(Main\ Page/Relax/Sandclock.jpg);
    }

    /* Timer */
    #demo {
      font-size: 30px;
      color: red;
      text-decoration: solid;
      text-align: center;
    }

    /* Settings Window Buttons */
    .settings-window-buttons {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-top: 40px;
    }
    #image_1,
      #image_2,
      #image_3,
      #image_4 {
        height: 70%;
        width: 70%;
        position: relative;
        margin: 0%;
      }
      .Stopwatch_Images{
        width: 15%;
        height: 15%;
      }
  </style>
</head>
<body>
  <!-- First Quotes Grid -->

    <div class="button-item">
      <button id="Button_1" onclick="toggleNewWindow('settings-window')"></button>
    </div>
  </div>

  <!-- Timer -->
  <div class="timer-grid-container">
    <p id="demo"></p>
  </div>

  <div class="grid-container, grid-container1">

      <a href="http://127.0.0.1:5500/Course/Ostali%20predmeti%20(nije%20za%20maturu%20(3,4%20razredi))/Logika/Logika.html" >

  <!-- Second Quotes Grid -->
  <div class="quotes-grid-container" id="quotes-grid-container_2">

  </div>

  <!-- Windows -->
  <div id="settings-window" class="new-window">
    <div class="settings-window-buttons">
      <button onclick="toggleNewWindow('empty-window')">LINKOVI</button>

    </div>

  </div>

  <div id="stopwatch-window" class="new-window">
    <h1 id="Timer_1">00:00:00</h1>
    <div class="stopwatch-buttons">
      <img src="Main Page/Stopwatch/Play.jpg" onclick="watchStart()">
      <img src="Main Page/Stopwatch/Stop.png" onclick="watchStop()">
      <img src="Main Page/Stopwatch/reset.jpg" onclick="watchReset()">

    <button onclick="toggleNewWindow('stopwatch-window')">Close</button>
  </div>

  <script>
    // Quote Rotation System
    const textItems = [
      "Everybody lies",
      "It always seems impossible until it is done.",
      "Tell me and I forget. Teach me and I remember. Involve me and I learn.",
      "Either you run the day or the day runs you."
    ];
    
    let currentIndex = 0;
    const rotateQuotes = () => {
      document.getElementById("quotes-item-1").textContent = textItems[currentIndex];
      document.getElementById("quotes-item-2").textContent = textItems[(currentIndex + 1) % textItems.length];
      currentIndex = (currentIndex + 1) % textItems.length;
    };
    setInterval(rotateQuotes, 3000);
    rotateQuotes(); // Initialize immediately

    // Window Toggle System
    const toggleNewWindow = (windowId) => {
      document.getElementById(windowId).classList.toggle("visible");
    };

    // Stopwatch System
    let [seconds, minutes, hours] = [0, 0, 0];
    let timer = null;
    const Timer_1 = document.getElementById("Timer_1");

    const updateTimer = () => {
      Timer_1.textContent = 
        `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    };

    const Stopwatch = () => {
      seconds++;
      if (seconds === 60) {
        seconds = 0;
        minutes++;
        if (minutes === 60) {
          minutes = 0;
          hours++;
        }
      }
      updateTimer();
    };

    const watchStart = () => {
      if (!timer) timer = setInterval(Stopwatch, 1000);
    };

    const watchStop = () => clearInterval(timer);
    
    const watchReset = () => {
      watchStop();
      [seconds, minutes, hours] = [0, 0, 0];
      updateTimer();
      timer = null;
    };

    // Countdown Timer
    const countDownDate = new Date("Jun 13, 2026 00:00:00").getTime();
    const countdownTimer = setInterval(() => {
      const now = new Date().getTime();
      const distance = countDownDate - now;
      
      document.getElementById("demo").innerHTML = 
        `${Math.floor(distance / (1000 * 60 * 60 * 24))}d 
        ${Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60))}h 
        ${Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60))}m 
        ${Math.floor((distance % (1000 * 60)) / 1000)}s`;

      if (distance < 0) {
        clearInterval(countdownTimer);
        document.getElementById("demo").innerHTML = "EXPIRED";
      }
    }, 1000);
  </script>
</body>
</html>
