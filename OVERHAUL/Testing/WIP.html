<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work in Progress</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #0b0d15;
            font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            padding: 1.5rem;
        }

        .container {
            text-align: center;
            max-width: 1200px;
            width: 100%;
            padding: 2rem 1rem;
        }

        .main-heading {
            font-size: clamp(4rem, 18vw, 12rem);
            font-weight: 900;
            letter-spacing: 0.03em;
            color: #fff;
            text-shadow: 0 0 20px rgba(99, 102, 241, 0.3),
                0 0 60px rgba(99, 102, 241, 0.1);
            line-height: 1.1;
            word-break: break-word;
            animation: fadeScale 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            opacity: 0;
            transform: scale(0.94);
        }

        /* subtle animated underline glow */
        .main-heading::after {
            content: '';
            display: block;
            width: 0;
            height: 6px;
            margin: 0.2em auto 0;
            background: linear-gradient(90deg, #818cf8, #a78bfa, #818cf8);
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(129, 140, 248, 0.4);
            animation: lineGrow 1.4s 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        .sub-text {
            margin-top: 1.8rem;
            font-size: clamp(1rem, 2.5vw, 1.8rem);
            font-weight: 300;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 0.25em;
            text-transform: uppercase;
            animation: fadeUp 1s 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            opacity: 0;
            transform: translateY(16px);
        }

        /* small decorative dots */
        .dots {
            display: flex;
            justify-content: center;
            gap: 0.6rem;
            margin-top: 2.2rem;
            animation: fadeUp 1s 1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            opacity: 0;
            transform: translateY(12px);
        }

        .dots span {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #818cf8;
            opacity: 0.35;
            animation: pulseDot 2.4s ease-in-out infinite;
        }

        .dots span:nth-child(2) {
            animation-delay: 0.4s;
        }
        .dots span:nth-child(3) {
            animation-delay: 0.8s;
        }

        /* ----- animations ----- */
        @keyframes fadeScale {
            0% {
                opacity: 0;
                transform: scale(0.94);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes lineGrow {
            0% {
                width: 0;
            }
            100% {
                width: 60%;
            }
        }

        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(16px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulseDot {
            0%,
            100% {
                opacity: 0.2;
                transform: scale(1);
            }
            50% {
                opacity: 0.8;
                transform: scale(1.4);
            }
        }

        /* responsive fine-tuning */
        @media (max-width: 600px) {
            .main-heading::after {
                height: 4px;
            }
            .sub-text {
                letter-spacing: 0.15em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="main-heading">Work in progress</h1>
        </div>

</body>
</html>
