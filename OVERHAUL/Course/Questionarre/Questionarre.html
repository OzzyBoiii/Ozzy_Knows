<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ozzy Knows · Recall + Anki AI</title>
    <style>
        /* ========== Improved CSS with better responsiveness, accessibility, and dark mode support ========== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        :root {
            --bg-gradient-start: #f0f2f5;
            --bg-gradient-end: #e6e9f0;
            --card-bg: rgba(255,255,255,0.75);
            --text-primary: #1e293b;
            --text-secondary: #475569;
            --accent: #2563eb;
            --accent-dark: #1d4ed8;
            --border-light: #cbd5e1;
            --border-dash: #94a3b8;
            --wrong-bg: #fee2e2;
            --wrong-text: #7f1d1d;
            --attention-bg: #ffedd5;
            --attention-text: #9a3412;
            --hint-bg: #fef9c3;
            --hint-border: #eab308;
            --shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
            --transition: 0.2s;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-gradient-start: #1e293b;
                --bg-gradient-end: #0f172a;
                --card-bg: rgba(30,41,59,0.85);
                --text-primary: #f1f5f9;
                --text-secondary: #cbd5e1;
                --accent: #3b82f6;
                --accent-dark: #2563eb;
                --border-light: #334155;
                --border-dash: #4b5563;
                --wrong-bg: #451a1a;
                --wrong-text: #fecaca;
                --attention-bg: #422006;
                --attention-text: #fed7aa;
                --hint-bg: #3b2e0b;
                --hint-border: #b45309;
                --shadow: 0 25px 50px -12px #000000;
            }
        }
        body {
            background: linear-gradient(145deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            color: var(--text-primary);
            line-height: 1.5;
            transition: background 0.3s, color 0.3s;
        }
        .app-container {
            max-width: 1100px;
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border-radius: 48px;
            box-shadow: var(--shadow);
            padding: 32px;
            border: 1px solid rgba(255,255,255,0.2);
        }
        h1, h2, h3 {
            font-weight: 500;
            color: var(--text-primary);
        }
        .screen {
            display: none;
        }
        .screen.active {
            display: block;
        }
        .welcome-content {
            text-align: center;
            padding: 20px 0;
        }
        .welcome-content h1 {
            font-size: 3.2rem;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .subtitle {
            font-size: 1.2rem;
            color: var(--text-secondary);
            margin-bottom: 40px;
        }
        .file-input-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        .file-row {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .file-card, .paste-card {
            background: var(--card-bg);
            border: 2px dashed var(--border-dash);
            border-radius: 32px;
            padding: 30px 40px;
            cursor: pointer;
            transition: var(--transition);
            min-width: 200px;
            color: var(--text-primary);
        }
        .file-card:hover, .paste-card:hover {
            border-color: var(--accent);
            background: rgba(37,99,235,0.05);
        }
        .file-card span, .paste-card span {
            font-size: 1.2rem;
        }
        #fileInput {
            display: none;
        }
        .lesson-info {
            margin-top: 20px;
            background: var(--card-bg);
            border-radius: 24px;
            padding: 16px 24px;
            box-shadow: 0 4px 6px -2px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
            border: 1px solid var(--border-light);
        }
        .lesson-info p {
            margin: 4px 0;
        }
        .start-btn {
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 60px;
            padding: 14px 40px;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 24px;
            box-shadow: 0 8px 16px -4px var(--accent);
            transition: var(--transition);
        }
        .start-btn:hover:not(:disabled) {
            background: var(--accent-dark);
            transform: scale(1.02);
        }
        .start-btn:disabled {
            opacity: 0.5;
            pointer-events: none;
            filter: grayscale(0.5);
        }
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            background: var(--card-bg);
            border-radius: 100px;
            padding: 12px 24px;
            box-shadow: 0 4px 6px -2px rgba(0,0,0,0.1);
            border: 1px solid var(--border-light);
        }
        .phase-badge {
            background: #e2e8f0;
            padding: 6px 16px;
            border-radius: 40px;
            font-weight: 600;
            color: #334155;
            text-transform: uppercase;
            font-size: 0.9rem;
        }
        .progress {
            font-weight: 600;
            color: var(--accent);
        }
        .progress-bar-container {
            width: 100%;
            height: 8px;
            background: var(--border-light);
            border-radius: 4px;
            margin: 8px 0 16px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.3s ease;
        }
        .cards-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin: 28px 0;
        }
        .quiz-card {
            background: var(--card-bg);
            border-radius: 32px;
            padding: 28px;
            box-shadow: 0 10px 20px -8px rgba(0,0,0,0.2);
            border: 1px solid var(--border-light);
        }
        .term-title {
            font-size: 1.6rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 20px;
            border-left: 8px solid var(--accent);
            padding-left: 20px;
        }
        .sentence-box {
            background: rgba(241,245,249,0.5);
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 24px;
            font-size: 1.2rem;
            line-height: 1.6;
            color: var(--text-primary);
            border: 1px solid var(--border-light);
        }
        .chosen-words {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 20px 0;
        }
        .chosen-tag {
            background: #dbeafe;
            color: #1e40af;
            padding: 8px 18px;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 500;
            border: 1px solid #bfdbfe;
        }
        .hint-text {
            background: var(--hint-bg);
            border-left: 6px solid var(--hint-border);
            padding: 16px 22px;
            border-radius: 16px;
            color: var(--attention-text);
            margin: 20px 0;
        }
        .recall-input, .recall-textarea {
            width: 100%;
            padding: 16px;
            border-radius: 40px;
            border: 2px solid var(--border-light);
            font-size: 1.1rem;
            margin: 16px 0;
            background: var(--card-bg);
            color: var(--text-primary);
        }
        .recall-textarea {
            border-radius: 24px;
            resize: vertical;
            min-height: 120px;
        }
        .recall-input:focus, .recall-textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(37,99,235,0.2);
        }
        .footer-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 16px;
            margin-top: 32px;
        }
        .footer-actions button {
            border: none;
            border-radius: 60px;
            padding: 14px 32px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            background: var(--card-bg);
            color: var(--text-primary);
            border: 1px solid var(--border-light);
        }
        #checkPhaseBtn, #importPasteBtn, #continueAfterRecallBtn {
            background: var(--accent);
            color: white;
            border: none;
        }
        #checkPhaseBtn:hover, #importPasteBtn:hover, #continueAfterRecallBtn:hover {
            background: var(--accent-dark);
        }
        .secondary:hover {
            background: rgba(0,0,0,0.05);
            border-color: var(--border-dash);
        }
        #exportWrongBtn {
            background: #8b5cf6;
            color: white;
            border: none;
        }
        #exportWrongBtn:hover {
            background: #7c3aed;
        }
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            backdrop-filter: blur(4px);
        }
        .modal.hidden { display: none; }
        .modal-small, .modal-large {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 40px;
            max-width: 700px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-light);
        }
        .modal-small { max-width: 400px; }
        .modal-large textarea {
            width: 100%;
            min-height: 200px;
            padding: 16px;
            border-radius: 24px;
            border: 1px solid var(--border-light);
            font-size: 0.95rem;
            margin-bottom: 16px;
            resize: vertical;
            background: var(--card-bg);
            color: var(--text-primary);
        }
        .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }
        .wrong-category h4 { margin: 8px 0 4px; }
        .wrong-item {
            padding: 6px 12px;
            border-radius: 40px;
            margin: 4px 0;
            background: var(--wrong-bg);
            color: var(--wrong-text);
        }
        .wrong-item.orange {
            background: var(--attention-bg);
            color: var(--attention-text);
        }
        .warning-text {
            color: #b45309;
            background: #fffbeb;
            padding: 8px 16px;
            border-radius: 40px;
            margin: 8px 0;
            font-size: 0.9rem;
        }
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0,0,0,0);
            border: 0;
        }
        @media (max-width: 600px) {
            .app-container { padding: 20px; }
            .footer-actions button { width: 100%; }
            .file-card, .paste-card { padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- WELCOME SCREEN -->
        <div id="welcomeScreen" class="screen active">
            <div class="welcome-content">
                <h1>🧠 Ozzy Knows Pro</h1>
                <div class="subtitle">Recall + AI‑powered Anki export</div>
                <div class="file-input-area">
                    <div class="file-row">
                        <div class="file-card" id="fileUploadCard" role="button" tabindex="0" aria-label="Upload files">
                            <span>📁 choose files</span>
                        </div>
                        <div class="paste-card" id="openPasteModalBtn" role="button" tabindex="0" aria-label="Paste lesson">
                            <span>📋 paste lesson</span>
                        </div>
                    </div>
                    <input type="file" id="fileInput" accept=".json,.csv,.txt,.md" multiple style="display: none;">
                    <div id="lessonInfo" class="lesson-info" style="display: none;" aria-live="polite">
                        <p><strong>loaded:</strong> <span id="lessonTitle"></span></p>
                        <p><span id="termCount"></span> terms</p>
                        <p><span id="fileList"></span></p>
                    </div>
                    <div class="file-row" style="margin-top: 16px;">
                        <button id="showWrongBtn" class="secondary" aria-label="Show wrong answers">📋 show wrong</button>
                        <button id="resetWrongBtn" class="secondary" aria-label="Reset wrong answers">🗑️ reset wrong</button>
                    </div>
                    <div id="wrongWarning" class="warning-text hidden" role="alert">⚠️ no wrong answers stored</div>
                    <button id="startLessonBtn" class="start-btn" disabled>▶ start recall</button>
                </div>
            </div>
        </div>

        <!-- QUIZ SCREEN -->
        <div id="quizScreen" class="screen">
            <div class="quiz-header">
                <span class="phase-badge" id="phaseLabel">Recall</span>
                <span class="progress" id="progressText">0/0</span>
            </div>
            <div class="progress-bar-container" aria-label="recall progress">
                <div id="progressBarFill" class="progress-bar-fill" style="width: 0%;"></div>
            </div>
            <div id="cardsContainer" class="cards-container" aria-live="polite">
                <!-- dynamically populated -->
            </div>
            <div class="footer-actions">
                <button id="backToWelcomeBtn" class="secondary" aria-label="Back to welcome screen">↩ back</button>
                <button id="hintBtn" class="secondary" style="display: none;">💡 hint</button>
                <button id="exportWrongBtn" class="secondary" style="display: none;" aria-label="Export wrong terms to Anki">🧠 export wrong → Anki AI</button>
                <button id="checkPhaseBtn" aria-label="Check answers">✅ check answers</button>
                <button id="finishPhaseBtn" class="secondary" style="display: none;" aria-label="Finish review">🏁 finish</button>
            </div>
        </div>
    </div>

    <!-- Paste Modal -->
    <div id="pasteModal" class="modal hidden" aria-modal="true" role="dialog" aria-labelledby="pasteModalTitle">
        <div class="modal-large" onclick="event.stopPropagation()">
            <h3 id="pasteModalTitle">📋 paste lesson content</h3>
            <textarea id="pasteContent" placeholder="Paste your .txt, .md, .json or .csv content here..."></textarea>
            <div class="modal-actions">
                <button id="cancelPasteBtn" class="secondary">Cancel</button>
                <button id="importPasteBtn">Import</button>
            </div>
        </div>
    </div>

    <!-- Wrong list modal -->
    <div id="wrongListModal" class="modal hidden" aria-modal="true" role="dialog" aria-labelledby="wrongListTitle">
        <div class="modal-small" onclick="event.stopPropagation()">
            <h3 id="wrongListTitle">❌ wrong answers</h3>
            <div id="wrongListContent" style="max-height:300px; overflow-y:auto; background:var(--card-bg); border-radius:24px; padding:12px; margin-bottom:16px;"></div>
            <div class="modal-actions">
                <button class="secondary" onclick="document.getElementById('wrongListModal').classList.add('hidden')">Close</button>
            </div>
        </div>
    </div>

    <!-- Summary modal after recall -->
    <div id="recallSummaryModal" class="modal hidden" aria-modal="true" role="dialog" aria-labelledby="recallSummaryTitle">
        <div class="modal-small" onclick="event.stopPropagation()">
            <h3 id="recallSummaryTitle">📊 recall results</h3>
            <p id="recallSummaryText"></p>
            <div class="modal-actions">
                <button id="continueAfterRecallBtn">Continue</button>
                <button class="secondary" onclick="document.getElementById('recallSummaryModal').classList.add('hidden');">Close</button>
            </div>
        </div>
    </div>

    <!-- Error modal -->
    <div id="errorModal" class="modal hidden" aria-modal="true" role="dialog" aria-labelledby="errorModalTitle">
        <div class="modal-small" onclick="event.stopPropagation()">
            <h3 id="errorModalTitle">⚠️ parsing errors</h3>
            <div id="errorList" style="max-height:300px; overflow-y:auto;"></div>
            <div class="modal-actions"><button class="secondary" onclick="document.getElementById('errorModal').classList.add('hidden')">Close</button></div>
        </div>
    </div>

    <!-- Loading indicator (hidden by default) -->
    <div id="loadingIndicator" class="modal hidden" style="background: transparent; backdrop-filter: none;" aria-hidden="true">
        <div class="modal-small" style="text-align: center; background: var(--card-bg);">
            <div class="loading-spinner" style="margin: 20px auto;"></div>
            <p>Processing...</p>
        </div>
    </div>

    <script>
        (function() {
            // ==================== 1. INDEXEDDB (with version upgrade robustness) ====================
            const DB_NAME = 'QuizDB';
            const DB_VERSION = 4;  // increased version to ensure upgrade runs
            const STORE_WRONG = 'wrongSets';
            const STORE_COUNTS = 'correctCounts';
            let db = null;

            function openDB() {
                return new Promise((resolve, reject) => {
                    if (db) return resolve(db);
                    if (!window.indexedDB) {
                        reject(new Error('IndexedDB not supported. Your answers will not persist.'));
                        return;
                    }
                    const request = indexedDB.open(DB_NAME, DB_VERSION);
                    request.onerror = () => reject(request.error);
                    request.onsuccess = () => { db = request.result; resolve(db); };
                    request.onupgradeneeded = (e) => {
                        const db = e.target.result;
                        // Create stores if they don't exist (safe for version upgrades)
                        if (!db.objectStoreNames.contains(STORE_WRONG)) {
                            db.createObjectStore(STORE_WRONG, { keyPath: 'id' });
                        }
                        if (!db.objectStoreNames.contains(STORE_COUNTS)) {
                            db.createObjectStore(STORE_COUNTS, { keyPath: 'id' });
                        }
                        // Additional upgrade logic for future versions can be added here
                    };
                });
            }

            async function getStoreData(storeName, id) {
                try {
                    await openDB();
                    return new Promise((resolve, reject) => {
                        const tx = db.transaction(storeName, 'readonly');
                        const store = tx.objectStore(storeName);
                        const req = store.get(id);
                        req.onsuccess = () => resolve(req.result ? req.result.data : null);
                        req.onerror = () => reject(req.error);
                    });
                } catch (e) {
                    console.warn('IndexedDB error:', e);
                    return null;
                }
            }

            async function putStoreData(storeName, id, data) {
                try {
                    await openDB();
                    return new Promise((resolve, reject) => {
                        const tx = db.transaction(storeName, 'readwrite');
                        const store = tx.objectStore(storeName);
                        const req = store.put({ id, data });
                        req.onsuccess = () => resolve();
                        req.onerror = () => reject(req.error);
                    });
                } catch (e) {
                    console.warn('IndexedDB error:', e);
                }
            }

            async function getWrongSet(id) {
                const data = await getStoreData(STORE_WRONG, id);
                return data ? new Set(data) : new Set();
            }
            async function saveWrongSet(id, set) {
                await putStoreData(STORE_WRONG, id, Array.from(set));
            }

            async function getCorrectCounts(id) {
                const data = await getStoreData(STORE_COUNTS, id);
                return data ? new Map(data) : new Map();
            }
            async function saveCorrectCounts(id, map) {
                await putStoreData(STORE_COUNTS, id, Array.from(map.entries()));
            }

            // ==================== 2. UTILITIES ====================
            function normalizeWord(word) {
                return word.replace(/[.,!?;:()"'\s]+$|^[.,!?;:()"'\s]+/g, '').toLowerCase();
            }

            function normalizeText(text) {
                if (!text) return '';
                return String(text)
                    .toLowerCase()
                    .replace(/[.,/#!$%^&*;:{}=\-_`~()?]/g, '')
                    .replace(/\s+/g, ' ')
                    .trim();
            }

            function levenshtein(a, b) {
                if (a.length === 0) return b.length;
                if (b.length === 0) return a.length;
                const matrix = [];
                for (let i = 0; i <= b.length; i++) matrix[i] = [i];
                for (let j = 0; j <= a.length; j++) matrix[0][j] = j;
                for (let i = 1; i <= b.length; i++) {
                    for (let j = 1; j <= a.length; j++) {
                        if (b.charAt(i-1) === a.charAt(j-1)) {
                            matrix[i][j] = matrix[i-1][j-1];
                        } else {
                            matrix[i][j] = Math.min(matrix[i-1][j-1] + 1,
                                                    matrix[i][j-1] + 1,
                                                    matrix[i-1][j] + 1);
                        }
                    }
                }
                return matrix[b.length][a.length];
            }

            function escapeHTML(str) {
                return String(str).replace(/[&<>"]/g, m => {
                    if (m === '&') return '&amp;';
                    if (m === '<') return '&lt;';
                    if (m === '>') return '&gt;';
                    if (m === '"') return '&quot;';
                    return m;
                });
            }

            // Debounce function for performance (e.g., input saving)
            function debounce(func, wait) {
                let timeout;
                return function executedFunction(...args) {
                    const later = () => {
                        clearTimeout(timeout);
                        func(...args);
                    };
                    clearTimeout(timeout);
                    timeout = setTimeout(later, wait);
                };
            }

            // Show/hide loading indicator
            const loadingIndicator = document.getElementById('loadingIndicator');
            function showLoading() { loadingIndicator.classList.remove('hidden'); }
            function hideLoading() { loadingIndicator.classList.add('hidden'); }

            // ==================== 3. PARSER (Improved CSV with quoted fields, better error handling) ====================
            function parseLessonFromText(content, fileName = 'pasted') {
                const errors = [];
                if (content.charCodeAt(0) === 0xFEFF) content = content.slice(1); // remove BOM
                const ext = fileName.split('.').pop().toLowerCase();

                if (ext === 'json') {
                    try {
                        const data = JSON.parse(content);
                        // Basic validation: should have title and terms array
                        if (!data.terms || !Array.isArray(data.terms)) {
                            errors.push('JSON missing "terms" array.');
                        } else {
                            // Ensure each term has required fields
                            data.terms = data.terms.filter(t => t.sentence && t.chosen && t.chosen.length);
                        }
                        return { lesson: data, errors };
                    } catch (e) {
                        errors.push('Invalid JSON: ' + e.message);
                        return { lesson: null, errors };
                    }
                } else if (ext === 'csv') {
                    // Improved CSV parser (handles quotes, commas)
                    const lines = content.split(/\r?\n/).map(l => l.trim()).filter(l => l);
                    if (lines.length < 2) {
                        errors.push('CSV must have header + at least one data row.');
                        return { lesson: null, errors };
                    }
                    const headers = parseCSVLine(lines[0]);
                    const terms = [];
                    for (let i = 1; i < lines.length; i++) {
                        const values = parseCSVLine(lines[i]);
                        let term = { term: '', sentence: '', chosen: [], immortal: [], image: '', hint: '' };
                        headers.forEach((h, idx) => {
                            const val = values[idx] || '';
                            if (h === 'term') term.term = val;
                            else if (h === 'sentence') term.sentence = val;
                            else if (h === 'chosen') term.chosen = val ? val.split('|').map(s => s.trim()) : [];
                            else if (h === 'immortal') term.immortal = val ? val.split(',').map(s => s.trim()) : [];
                            else if (h === 'image') term.image = val;
                            else if (h === 'hint') term.hint = val;
                        });
                        if (term.sentence && term.chosen.length) {
                            terms.push(term);
                        } else {
                            errors.push(`Line ${i+1}: missing sentence or chosen.`);
                        }
                    }
                    return { lesson: { title: fileName.replace('.csv',''), terms }, errors };
                } else {
                    // Plain text / markdown (existing parser)
                    const lines = content.split('\n');
                    let title = 'Untitled';
                    const terms = [];
                    let currentTerm = null;
                    for (let line of lines) {
                        line = line.trim();
                        if (line.startsWith('# ')) {
                            title = line.substring(2).trim();
                        } else if (line.startsWith('- ')) {
                            if (currentTerm && currentTerm.sentence) terms.push(currentTerm);
                            currentTerm = {
                                term: line.substring(2).trim(),
                                sentence: '',
                                chosen: [],
                                immortal: [],
                                image: '',
                                hint: ''
                            };
                        } else if (currentTerm) {
                            if (line.startsWith('Sentence:')) {
                                currentTerm.sentence = line.substring(9).trim();
                            } else if (line.startsWith('Chosen:')) {
                                const raw = line.substring(7).trim();
                                if (raw) {
                                    currentTerm.chosen = raw.split(',').flatMap(part =>
                                        part.trim().split('|').map(s => s.trim())
                                    ).filter(s => s);
                                }
                            } else if (line.startsWith('Image:')) {
                                currentTerm.image = line.substring(6).trim();
                            } else if (line.startsWith('Hint:')) {
                                currentTerm.hint = line.substring(5).trim();
                            }
                        }
                    }
                    if (currentTerm && currentTerm.sentence) terms.push(currentTerm);
                    if (terms.length === 0) errors.push('No valid terms found.');
                    return { lesson: { title, terms }, errors };
                }
            }

            // Simple CSV line parser (handles quoted fields with commas)
            function parseCSVLine(line) {
                const result = [];
                let start = 0;
                let inQuotes = false;
                for (let i = 0; i < line.length; i++) {
                    if (line[i] === '"') {
                        inQuotes = !inQuotes;
                    } else if (line[i] === ',' && !inQuotes) {
                        result.push(line.substring(start, i).replace(/^"|"$/g, '').trim());
                        start = i + 1;
                    }
                }
                result.push(line.substring(start).replace(/^"|"$/g, '').trim());
                return result;
            }

            // ==================== 4. STATE ====================
            let currentLesson = null;
            let currentFileIdentifier = '';
            let phase = 'recall';          // recall or reveal
            let currentTermsIndices = [];   // indices of terms being shown
            let wrongIndicesGlobal = new Set();
            let correctStreakMap = new Map();
            let userTermInputs = [];        // store term inputs per index
            let userDefInputs = [];          // store definition inputs per index

            // DOM elements
            const welcomeScreen = document.getElementById('welcomeScreen');
            const quizScreen = document.getElementById('quizScreen');
            const fileInput = document.getElementById('fileInput');
            const fileUploadCard = document.getElementById('fileUploadCard');
            const lessonInfoDiv = document.getElementById('lessonInfo');
            const lessonTitleSpan = document.getElementById('lessonTitle');
            const termCountSpan = document.getElementById('termCount');
            const fileListSpan = document.getElementById('fileList');
            const startBtn = document.getElementById('startLessonBtn');
            const backToWelcomeBtn = document.getElementById('backToWelcomeBtn');
            const hintBtn = document.getElementById('hintBtn');
            const exportWrongBtn = document.getElementById('exportWrongBtn');
            const checkPhaseBtn = document.getElementById('checkPhaseBtn');
            const finishPhaseBtn = document.getElementById('finishPhaseBtn');
            const phaseLabel = document.getElementById('phaseLabel');
            const progressText = document.getElementById('progressText');
            const progressBarFill = document.getElementById('progressBarFill');
            const cardsContainer = document.getElementById('cardsContainer');
            const showWrongBtn = document.getElementById('showWrongBtn');
            const resetWrongBtn = document.getElementById('resetWrongBtn');
            const wrongWarning = document.getElementById('wrongWarning');
            const openPasteModalBtn = document.getElementById('openPasteModalBtn');
            const pasteModal = document.getElementById('pasteModal');
            const cancelPasteBtn = document.getElementById('cancelPasteBtn');
            const importPasteBtn = document.getElementById('importPasteBtn');
            const pasteContent = document.getElementById('pasteContent');
            const wrongListModal = document.getElementById('wrongListModal');
            const wrongListContent = document.getElementById('wrongListContent');
            const recallSummaryModal = document.getElementById('recallSummaryModal');
            const recallSummaryText = document.getElementById('recallSummaryText');
            const continueAfterRecallBtn = document.getElementById('continueAfterRecallBtn');
            const errorModal = document.getElementById('errorModal');
            const errorList = document.getElementById('errorList');

            // ==================== 5. PERSISTENCE ====================
            async function loadPersistentData(identifier) {
                wrongIndicesGlobal = await getWrongSet(identifier);
                correctStreakMap = await getCorrectCounts(identifier);
            }

            async function savePersistentData(identifier) {
                await saveWrongSet(identifier, wrongIndicesGlobal);
                await saveCorrectCounts(identifier, correctStreakMap);
                updateWrongWarning();
            }

            // ==================== 6. RENDERING ====================
            function renderQuiz() {
                if (!currentLesson) return;
                const terms = currentLesson.terms;
                const indices = currentTermsIndices;

                let html = '';
                for (let idx of indices) {
                    const t = terms[idx];
                    const savedTerm = userTermInputs[idx] || '';
                    const savedDef = userDefInputs[idx] || '';

                    html += `<div class="quiz-card" data-index="${idx}">`;
                    html += `<div class="term-title">${escapeHTML(t.term) || '?'}</div>`;

                    if (phase === 'recall') {
                        html += `<input type="text" class="recall-input term-input" data-index="${idx}" value="${escapeHTML(savedTerm)}" placeholder="Enter term..." aria-label="Your answer for term">`;
                        html += `<textarea class="recall-textarea def-input" data-index="${idx}" placeholder="Write the full sentence from memory..." aria-label="Your answer for sentence">${escapeHTML(savedDef)}</textarea>`;
                    } else if (phase === 'reveal') {
                        if (t.hint) {
                            html += `<div class="hint-text">💡 ${escapeHTML(t.hint)}</div>`;
                        } else {
                            html += `<p>No hint available.</p>`;
                        }
                    }

                    if (t.chosen && t.chosen.length) {
                        html += '<div class="chosen-words">';
                        t.chosen.forEach(word => {
                            html += `<span class="chosen-tag">${escapeHTML(word)}</span>`;
                        });
                        html += '</div>';
                    }

                    html += '</div>';
                }
                cardsContainer.innerHTML = html;

                // Update header
                phaseLabel.textContent = phase === 'recall' ? 'Recall' : 'Review';
                progressText.textContent = `${indices.length}/${currentLesson.terms.length}`;
                updateProgressBar();

                // Button visibility
                backToWelcomeBtn.style.display = 'inline-block';
                if (phase === 'recall') {
                    hintBtn.style.display = 'none';
                    exportWrongBtn.style.display = 'none';
                    checkPhaseBtn.style.display = 'inline-block';
                    finishPhaseBtn.style.display = 'none';
                } else { // reveal
                    hintBtn.style.display = 'none';
                    exportWrongBtn.style.display = 'inline-block';
                    checkPhaseBtn.style.display = 'none';
                    finishPhaseBtn.style.display = 'inline-block';
                }

                // Attach input listeners using event delegation (performance)
                if (phase === 'recall') {
                    cardsContainer.addEventListener('input', handleInput);
                } else {
                    cardsContainer.removeEventListener('input', handleInput);
                }
            }

            function handleInput(e) {
                const target = e.target;
                if (target.classList.contains('term-input') || target.classList.contains('def-input')) {
                    const idx = target.dataset.index;
                    if (target.classList.contains('term-input')) {
                        userTermInputs[idx] = target.value;
                    } else {
                        userDefInputs[idx] = target.value;
                    }
                    updateProgressBar();
                }
            }

            function updateProgressBar() {
                if (phase === 'recall') {
                    const termInputs = document.querySelectorAll('.term-input');
                    const defTextareas = document.querySelectorAll('.def-input');
                    let filled = 0;
                    termInputs.forEach(inp => { if (inp.value.trim() !== '') filled++; });
                    defTextareas.forEach(ta => { if (ta.value.trim() !== '') filled++; });
                    const total = termInputs.length * 2;
                    const percent = total > 0 ? (filled / total) * 100 : 0;
                    progressBarFill.style.width = percent + '%';
                } else {
                    progressBarFill.style.width = '0%';
                }
            }

            // ==================== 7. CHECK ANSWERS (RECALL) ====================
            async function checkAnswers() {
                if (!currentLesson || phase !== 'recall') return;

                const termInputs = document.querySelectorAll('.term-input');
                const defTextareas = document.querySelectorAll('.def-input');
                let correctCount = 0;
                const wrongInRecall = [];

                for (let i = 0; i < termInputs.length; i++) {
                    const inp = termInputs[i];
                    const ta = defTextareas[i];
                    const idx = parseInt(inp.dataset.index);
                    const term = currentLesson.terms[idx];

                    const userTerm = normalizeText(inp.value);
                    const actualTerm = normalizeText(term.term);
                    const userDef = normalizeText(ta.value);
                    const actualDef = normalizeText(term.sentence);

                    const termCorrect = (userTerm === actualTerm) || (levenshtein(userTerm, actualTerm) <= 1);
                    const defCorrect = (userDef === actualDef) || (levenshtein(userDef, actualDef) <= 2);

                    if (termCorrect && defCorrect) {
                        correctCount++;
                        let streak = correctStreakMap.get(idx) || 0;
                        streak++;
                        correctStreakMap.set(idx, streak);
                        if (streak >= 3) {
                            wrongIndicesGlobal.delete(idx);
                        }
                    } else {
                        wrongInRecall.push(idx);
                        correctStreakMap.set(idx, 0);
                        wrongIndicesGlobal.add(idx);
                    }
                }

                await savePersistentData(currentFileIdentifier);

                // Show summary
                recallSummaryText.innerText = `You got ${correctCount} out of ${termInputs.length} correct.`;
                recallSummaryModal.classList.remove('hidden');

                // Move to reveal phase with wrong terms only
                currentTermsIndices = Array.from(wrongIndicesGlobal).filter(i => i < currentLesson.terms.length);
                phase = 'reveal';
                renderQuiz();
            }

            // ==================== 8. EXPORT WRONG TERMS ====================
            async function exportWrongTerms() {
                if (!currentLesson) {
                    alert('No lesson loaded.');
                    return;
                }
                if (!wrongIndicesGlobal || wrongIndicesGlobal.size === 0) {
                    alert('No wrong terms to export.');
                    return;
                }

                const terms = currentLesson.terms;
                const wrongTerms = [];

                for (let idx of wrongIndicesGlobal) {
                    if (idx >= 0 && idx < terms.length) {
                        const t = terms[idx];
                        wrongTerms.push({
                            index: idx,
                            term: t.term || '',
                            sentence: t.sentence || '',
                            chosen: Array.isArray(t.chosen) ? t.chosen : [],
                            hint: t.hint || ''
                        });
                    }
                }

                if (wrongTerms.length === 0) {
                    alert('No wrong terms to export.');
                    return;
                }

                const payload = {
                    lessonTitle: currentLesson.title || 'Untitled',
                    fileIdentifier: currentFileIdentifier || '',
                    exportedAt: new Date().toISOString(),
                    wrongTerms: wrongTerms
                };

                // Try local server with timeout
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 2000); // increased timeout

                    const response = await fetch('http://localhost:8000/export', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload),
                        signal: controller.signal
                    });
                    clearTimeout(timeoutId);

                    if (response.ok) {
                        const result = await response.json();
                        alert(`✅ Server accepted.\n${result.message || 'Cards generated and sent to Anki.'}`);
                        return;
                    } else {
                        throw new Error(`Server error: ${response.status}`);
                    }
                } catch (err) {
                    console.warn('Local server not reachable, falling back to download.', err);
                    // Fallback: download JSON
                    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'wrong_terms.json';
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    URL.revokeObjectURL(url);
                    alert('wrong_terms.json downloaded.\nMove it to Python_Support and run the script manually.');
                }
            }

            // ==================== 9. LOAD LESSON ====================
            async function loadLesson(lesson, identifier, fileNames) {
                if (!lesson || !lesson.terms.length) {
                    alert('No valid terms found.');
                    return false;
                }
                currentLesson = lesson;
                currentFileIdentifier = identifier;

                await loadPersistentData(identifier);

                // Initialize user input arrays
                userTermInputs = new Array(lesson.terms.length).fill('');
                userDefInputs = new Array(lesson.terms.length).fill('');

                lessonTitleSpan.textContent = lesson.title || 'Untitled';
                termCountSpan.textContent = lesson.terms.length;
                fileListSpan.textContent = fileNames.join(', ');
                lessonInfoDiv.style.display = 'block';
                startBtn.disabled = false;
                updateWrongWarning();
                return true;
            }

            function updateWrongWarning() {
                if (wrongIndicesGlobal.size === 0 && currentLesson) {
                    wrongWarning.classList.remove('hidden');
                } else {
                    wrongWarning.classList.add('hidden');
                }
            }

            // ==================== 10. EVENT LISTENERS (with improved accessibility) ====================
            fileUploadCard.addEventListener('click', () => fileInput.click());
            fileUploadCard.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); } });

            openPasteModalBtn.addEventListener('click', () => {
                pasteContent.value = '';
                pasteModal.classList.remove('hidden');
                pasteContent.focus();
            });
            openPasteModalBtn.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pasteModal.classList.remove('hidden'); pasteContent.focus(); } });

            cancelPasteBtn.addEventListener('click', () => pasteModal.classList.add('hidden'));
            importPasteBtn.addEventListener('click', async () => {
                const text = pasteContent.value.trim();
                if (!text) { alert('Please paste some content.'); return; }
                showLoading();
                setTimeout(async () => { // allow UI update
                    const { lesson, errors } = parseLessonFromText(text, 'pasted.txt');
                    hideLoading();
                    if (errors.length > 0) {
                        errorList.innerHTML = errors.map(e => `<div>⚠️ ${escapeHTML(e)}</div>`).join('');
                        errorModal.classList.remove('hidden');
                    }
                    if (!lesson || !lesson.terms.length) {
                        alert('No valid terms found.');
                        return;
                    }
                    const identifier = 'pasted_' + Date.now();
                    await loadLesson(lesson, identifier, ['pasted content']);
                    pasteModal.classList.add('hidden');
                }, 50);
            });

            fileInput.addEventListener('change', async (e) => {
                const files = Array.from(e.target.files);
                if (files.length === 0) return;

                showLoading();
                let allTerms = [];
                let mainTitle = 'Combined lesson';
                let fileIdentifier = '';
                const fileNames = [];
                const allErrors = [];

                for (let file of files) {
                    const content = await file.text();
                    fileNames.push(file.name);
                    fileIdentifier += file.name + '_' + file.size + '_';
                    const { lesson, errors } = parseLessonFromText(content, file.name);
                    allErrors.push(...errors);
                    if (lesson && lesson.terms.length > 0) {
                        allTerms = allTerms.concat(lesson.terms);
                        if (lesson.title !== 'Untitled' && mainTitle === 'Combined lesson') {
                            mainTitle = lesson.title;
                        }
                    }
                }
                hideLoading();

                if (allErrors.length > 0) {
                    errorList.innerHTML = allErrors.map(e => `<div>⚠️ ${escapeHTML(e)}</div>`).join('');
                    errorModal.classList.remove('hidden');
                }

                if (allTerms.length === 0) {
                    alert('No valid terms found.');
                    return;
                }

                const lesson = { title: mainTitle, terms: allTerms };
                const identifier = fileIdentifier + 'mode_files';
                await loadLesson(lesson, identifier, fileNames);
            });

            startBtn.addEventListener('click', () => {
                if (!currentLesson) return;
                currentTermsIndices = currentLesson.terms.map((_, i) => i);
                phase = 'recall';
                renderQuiz();
                welcomeScreen.classList.remove('active');
                quizScreen.classList.add('active');
                // Focus on first input for accessibility
                setTimeout(() => {
                    const firstInput = document.querySelector('.term-input');
                    if (firstInput) firstInput.focus();
                }, 100);
            });

            backToWelcomeBtn.addEventListener('click', () => {
                quizScreen.classList.remove('active');
                welcomeScreen.classList.add('active');
                // Clean up event listener
                cardsContainer.removeEventListener('input', handleInput);
            });

            // Keyboard shortcut: Ctrl+Enter to check answers
            document.addEventListener('keydown', (e) => {
                if (e.ctrlKey && e.key === 'Enter' && quizScreen.classList.contains('active') && phase === 'recall') {
                    e.preventDefault();
                    checkAnswers();
                }
            });

            checkPhaseBtn.addEventListener('click', checkAnswers);

            continueAfterRecallBtn.addEventListener('click', () => {
                recallSummaryModal.classList.add('hidden');
            });

            finishPhaseBtn.addEventListener('click', async () => {
                quizScreen.classList.remove('active');
                welcomeScreen.classList.add('active');
                cardsContainer.removeEventListener('input', handleInput);
            });

            exportWrongBtn.addEventListener('click', exportWrongTerms);

            showWrongBtn.addEventListener('click', () => {
                if (!currentLesson) {
                    wrongListContent.innerHTML = '<p>No lesson loaded.</p>';
                } else {
                    const terms = currentLesson.terms;
                    const wrongItems = [];
                    const attentionItems = [];
                    for (let idx of wrongIndicesGlobal) {
                        if (idx >= terms.length) continue;
                        const term = terms[idx].term;
                        const streak = correctStreakMap.get(idx) || 0;
                        if (streak === 0) wrongItems.push(term);
                        else if (streak < 3) attentionItems.push(term);
                    }
                    let html = '<div class="wrong-category"><h4>❌ wrong (0 correct streak)</h4>';
                    wrongItems.forEach(t => html += `<div class="wrong-item">${escapeHTML(t)}</div>`);
                    html += '</div><div class="wrong-category"><h4>🟠 needs more attention (1-2 correct)</h4>';
                    attentionItems.forEach(t => html += `<div class="wrong-item orange">${escapeHTML(t)}</div>`);
                    html += '</div>';
                    wrongListContent.innerHTML = html || '<p>No wrong answers.</p>';
                }
                wrongListModal.classList.remove('hidden');
            });

            resetWrongBtn.addEventListener('click', async () => {
                if (!currentFileIdentifier) return;
                if (confirm('Delete all wrong answers for this lesson?')) {
                    wrongIndicesGlobal.clear();
                    correctStreakMap.clear();
                    await savePersistentData(currentFileIdentifier);
                    updateWrongWarning();
                }
            });

            // Close modals on background click and with Escape key
            [pasteModal, wrongListModal, recallSummaryModal, errorModal].forEach(m => {
                m.addEventListener('click', (e) => { if (e.target === m) m.classList.add('hidden'); });
                m.addEventListener('keydown', (e) => { if (e.key === 'Escape') m.classList.add('hidden'); });
            });

            // ==================== 11. INIT ====================
            // Disable start button initially
            startBtn.disabled = true;

            // Add instruction for keyboard shortcut
            const shortcutHint = document.createElement('div');
            shortcutHint.className = 'visually-hidden';
            shortcutHint.setAttribute('aria-live', 'polite');
            shortcutHint.textContent = 'In recall phase, press Ctrl+Enter to check answers.';
            document.body.appendChild(shortcutHint);

            // Ensure progress bar exists
            if (!progressBarFill) {
                console.warn('Progress bar element missing, creating it.');
                const container = document.querySelector('.progress-bar-container');
                if (container) {
                    container.innerHTML = '<div id="progressBarFill" class="progress-bar-fill" style="width:0%;"></div>';
                }
            }
        })();
    </script>
</body>
