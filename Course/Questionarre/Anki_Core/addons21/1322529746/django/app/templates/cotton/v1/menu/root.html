<c-vars
    class=""
    list_base_class="absolute flex flex-col gap-1 z-10 mt-2 bg-background-basic-surface shadow-xl rounded-2xl py-1 px-1 text-base overflow-auto focus:outline-none sm:text-sm"
/>

<ul
    class="{{ list_base_class }} {{ class }}"
    role="listbox"
    aria-labelledby="listbox-label"
    aria-activedescendant="listbox-option-3"
    @menuitem-click="$dispatch('action', { index: $event.detail.index })"
    {{ attrs }}
>
    {{ slot }}
</ul>
