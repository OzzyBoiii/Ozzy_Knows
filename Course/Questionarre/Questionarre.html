                onlyWrongCheck.addEventListener('change', updateWrongWarning);

                function saveSession() {
                    if (!currentLesson || !currentFileIdentifier) return;
                    const session = {
                        fileIdentifier: currentFileIdentifier,
                        lessonTitle: currentLesson.title,
                        indices: currentTermsIndices,
                        phase: phase,
                    };
                    localStorage.setItem('quiz_lastSession', JSON.stringify(session));
                }

                function cacheLesson(lesson, identifier, fileNames) {
                    const cache = { lesson, identifier, fileNames, timestamp: Date.now() };
                    sessionStorage.setItem('quizSession', JSON.stringify(cache));
                }

                function loadCachedLesson() {
                    const cached = sessionStorage.getItem('quizSession');
                    if (cached) {
                        try {
                            return JSON.parse(cached);
                        } catch (e) {}
                    }
                    return null;
                }

                function showHiddenTerms() {
                    // For original hint button
                    const items = [];
                    const cards = document.querySelectorAll('.term-card');
                    cards.forEach(card => {
                        const termTitle = card.querySelector('.term-title')?.innerText || '?';
                        const inputs = card.querySelectorAll('.blank-input input');
                        inputs.forEach(inp => {
                            const expected = inp.dataset.expected;
                            if (expected) {
                                items.push(`${termTitle}: “${expected}”`);
                            }
                        });
                    });
                    for (let i = items.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [items[i], items[j]] = [items[j], items[i]];
                    }
                    let html = '<ul class="hidden-terms-list">';
                    items.forEach(item => { html += `<li>${escapeHTML(item)}</li>`; });
                    html += '</ul>';
                    hiddenTermsList.innerHTML = html || '<p>No hidden terms right now.</p>';
                    hintModal.classList.remove('hidden');
                }

                // ========== IMAGE MODAL ==========
                window.showImageModal = (src) => {
                    modalImage.src = src;
                    imageModal.classList.remove('hidden');
                };
                imageModal.addEventListener('click', () => imageModal.classList.add('hidden'));

                // ========== CLOSE MODALS ON BACKGROUND CLICK ==========
                [pasteModal, hintModal, summaryModal, errorModal, titleHintModal, wrongListModal, recallSummaryModal, settingsModal].forEach(m => {
                    m.addEventListener('click', (e) => { if (e.target === m) m.classList.add('hidden'); });
                });

                // ========== KEYBOARD SHORTCUT ==========
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && document.activeElement.tagName === 'INPUT') {
                        const inputs = Array.from(document.querySelectorAll('.blank-input input'));
                        if (inputs.indexOf(document.activeElement) === inputs.length - 1) {
                            checkBtn.click();
                        }
                    }
                });

                // ========== INPUT UPDATES ==========
                maxBlanksInput.addEventListener('input', () => {
                    maxBlanks = parseInt(maxBlanksInput.value) || 5;
                });
                termCountInput.addEventListener('input', () => {
                    if (currentLesson) {
                        const max = currentLesson.terms.length;
                        if (parseInt(termCountInput.value) > max) termCountInput.value = max;
                    }
                });

                // ========== AUTO-BACKUP EVERY 5 MINUTES ==========
                setInterval(() => {
                    if (currentLesson && !welcomeScreen.classList.contains('hidden')) {
                        savePersistentData(currentFileIdentifier);
                    }
                }, 300000);

                // ========== BEFORE UNLOAD WARNING ==========
                window.addEventListener('beforeunload', (e) => {
                    if (welcomeScreen.classList.contains('hidden')) {
                        e.preventDefault();
                        e.returnValue = 'You have an ongoing quiz. Are you sure you want to leave?';
                    }
                });

                function setAriaLabels() {
                    document.querySelectorAll('button').forEach(btn => {
                        if (!btn.hasAttribute('aria-label')) {
                            btn.setAttribute('aria-label', btn.innerText.trim());
                        }
                    });
                }
            });
        })();
    </script>
</body>
</html>
