<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📘 Questionaire · advanced recall + fill‑in</title>
    <!-- KaTeX -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <!-- Mermaid -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.0/dist/mermaid.min.js"></script>
    <!-- Highlight.js -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/default.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        body { margin: 0; min-height: 100vh; background: #f5f7fb; color: #0f172a; display: flex; justify-content: center; align-items: center; padding: 16px; }
        .app-container { max-width: 1200px; width: 100%; background: white; border-radius: 32px; box-shadow: 0 8px 25px rgba(0,0,0,0.04); padding: 24px; }
        .hidden { display: none !important; }
        h1, h2, h3 { margin-top: 0; font-weight: 600; color: #0f172a; }
        h1 { font-size: 1.8rem; margin-bottom: 20px; }

        /* file area */
        .file-area-split { display: flex; gap: 20px; margin-bottom: 24px; flex-wrap: wrap; }
        .file-card, .paste-card { flex: 1 1 220px; background: #f8fafc; border-radius: 24px; padding: 20px; border: 2px dashed #cbd5e1; transition: 0.2s; min-width: 200px; }
        .paste-card { border: 2px solid #cbd5e1; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .file-card:hover, .paste-card:hover { border-color: #1e3a8a; background: white; }
        .file-icon, .paste-icon { font-size: 2.2rem; margin-bottom: 12px; }
        .file-input-label { display: inline-block; background: #1e3a8a; color: white; padding: 8px 16px; border-radius: 60px; font-weight: 500; font-size: 0.9rem; cursor: pointer; width: 100%; text-align: center; }
        .file-input-label:hover { background: #2563eb; }
        .file-list { margin-top: 12px; font-size: 0.85rem; max-height: 100px; overflow-y: auto; background: white; padding: 8px 12px; border-radius: 20px; border: 1px solid #e2e8f0; }

        .inputs-row { display: flex; gap: 20px; align-items: flex-end; flex-wrap: wrap; margin: 24px 0; background: #f1f5f9; padding: 18px 20px; border-radius: 28px; }
        .input-item { display: flex; flex-direction: column; min-width: 140px; }
        .input-item label { font-size: 0.8rem; font-weight: 600; color: #334155; margin-bottom: 4px; text-transform: uppercase; }
        .input-item input[type="number"] { padding: 10px 14px; border-radius: 60px; border: 1px solid #cbd5e1; font-size: 0.95rem; background: white; }

        .options-row { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; margin: 16px 0; padding: 12px 20px; background: #f1f5f9; border-radius: 60px; }
        .option-check { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 0.95rem; color: #0f172a; }
        .option-check input[type="checkbox"] { width: 16px; height: 16px; accent-color: #1e3a8a; }
        .resume-btn { background: white; border: 1px solid #94a3b8; color: #1e3a8a; padding: 6px 16px; border-radius: 60px; font-size: 0.85rem; font-weight: 500; cursor: pointer; margin-left: auto; }
        .resume-btn:hover { background: #eef2ff; }

        button { background: #1e3a8a; color: white; border: none; padding: 10px 24px; border-radius: 60px; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: 0.15s; border: 1px solid #1e3a8a; }
        button.secondary { background: white; color: #1e3a8a; border-color: #94a3b8; }
        button:hover { background: #2563eb; transform: scale(1.02); }
        button.secondary:hover { background: #eef2ff; }
        button.small { padding: 6px 16px; font-size: 0.85rem; }

        .warning-text { color: #b45309; background: #fffbeb; padding: 8px 16px; border-radius: 40px; margin: 8px 0; font-size: 0.9rem; }

        .quiz-header { display: flex; flex-direction: column; align-items: center; margin-bottom: 16px; position: relative; }
        #lesson-title { font-size: 1.8rem; font-weight: 700; color: #0f172a; margin: 0 0 8px; cursor: pointer; padding: 4px 12px; border-radius: 60px; transition: background 0.1s; }
        #lesson-title:hover { background: #f1f5f9; }
        .phase-indicator { border-radius: 60px; padding: 6px 20px; font-weight: 500; background: #ede9fe; color: #5b21b6; font-size: 0.9rem; margin-bottom: 8px; }

        .progress-container { width: 100%; height: 8px; background: #e2e8f0; border-radius: 60px; margin: 12px 0 20px; overflow: hidden; }
        #progress-fill { height: 100%; background: #1e3a8a; width: 0%; transition: width 0.2s, background-color 0.2s; }
        .progress-pulse { animation: pulse 0.5s ease; }
        @keyframes pulse { 0% { background-color: #1e3a8a; } 50% { background-color: #4f7df3; } 100% { background-color: #1e3a8a; } }

        .term-grid { display: flex; flex-direction: column; gap: 16px; margin: 16px 0; }
        .term-card { background: white; border-radius: 24px; padding: 16px 20px; border: 1px solid #e9eef2; box-shadow: 0 2px 6px rgba(0,0,0,0.02); transition: box-shadow 0.2s; }
        .term-card:hover { box-shadow: 0 8px 20px rgba(0,0,0,0.05); }
        .term-title-input { width: 100%; padding: 8px 12px; border-radius: 60px; border: 2px solid #cbd5e1; font-size: 1rem; background: white; margin-bottom: 8px; }
        .recall-textarea { width: 100%; padding: 10px 14px; border-radius: 20px; border: 2px solid #cbd5e1; font-size: 1rem; background: white; resize: vertical; min-height: 80px; }
        .recall-textarea.correct-highlight, .term-title-input.correct-highlight { border-color: #059669; background: #ecfdf5; }
        .recall-textarea.wrong-highlight, .term-title-input.wrong-highlight { border-color: #b91c1c; background: #fef2f2; }

        .term-image { max-width: 100%; max-height: 140px; border-radius: 16px; margin: 8px 0; object-fit: cover; cursor: pointer; border: 1px solid #d1d9e8; }
        .sentence-box { background: #f9fafc; border-radius: 20px; padding: 16px; font-size: 1rem; line-height: 1.8; margin: 8px 0; border: 1px solid #e2e8f0; overflow-x: auto; }
        .blank-input { display: inline-block; margin: 0 2px; }
        .blank-input input { width: 100px; padding: 6px 10px; border-radius: 40px; border: 2px solid #cbd5e1; font-size: 0.9rem; text-align: center; background: white; }
        .blank-input input.correct-highlight { border-color: #059669; background: #ecfdf5; }
        .blank-input input.wrong-highlight { border-color: #b91c1c; background: #fef2f2; }
        .hint-icon { font-size: 0.8rem; margin-left: 4px; cursor: pointer; background: #e2e8f0; border-radius: 50%; width: 20px; height: 20px; display: inline-flex; align-items: center; justify-content: center; color: #1e3a8a; }

        .footer-actions { display: flex; gap: 12px; justify-content: flex-end; flex-wrap: wrap; margin-top: 20px; }

        /* modals */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.3); display: flex; justify-content: center; align-items: center; z-index: 2000; backdrop-filter: blur(4px); }
        .modal-small { background: white; padding: 24px; border-radius: 40px; max-width: 400px; width: 90%; box-shadow: 0 20px 40px rgba(0,0,0,0.2); max-height: 80vh; overflow-y: auto; }
        .modal-large { background: white; padding: 24px; border-radius: 40px; max-width: 700px; width: 90%; max-height: 80vh; overflow-y: auto; }
        .modal-large textarea { width: 100%; min-height: 200px; padding: 16px; border-radius: 24px; border: 1px solid #cbd5e1; font-size: 0.95rem; margin-bottom: 16px; resize: vertical; }
        .modal-actions { display: flex; gap: 12px; justify-content: flex-end; flex-wrap: wrap; }

        .hidden-terms-list { list-style: none; padding: 0; margin: 16px 0; }
        .hidden-terms-list li { padding: 8px 12px; background: #f1f5f9; border-radius: 40px; margin-bottom: 6px; font-size: 0.95rem; }

        .wrong-category { margin-bottom: 16px; }
        .wrong-category h4 { margin: 8px 0 4px; }
        .wrong-item { padding: 6px 12px; border-radius: 40px; margin: 4px 0; background: #fee2e2; color: #7f1d1d; }
        .wrong-item.orange { background: #ffedd5; color: #9a3412; }

        .settings-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
        .settings-row label { min-width: 140px; }

        .loader { display: inline-block; width: 20px; height: 20px; border: 3px solid #e2e8f0; border-top-color: #1e3a8a; border-radius: 50%; animation: spin 1s linear infinite; margin-left: 8px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 600px) { .app-container { padding: 16px; } }
    </style>
</head>
<body>
    <div class="app-container">
        <div id="topBarWelcome" style="display: flex; justify-content: space-between; margin-bottom: 12px;">
            <button id="settingsBtn" class="secondary small">⚙️ settings</button>
            <button id="showWrongBtn" class="secondary small">📋 show wrong answers</button>
        </div>
        <div id="topBarQuiz" style="display: none; justify-content: space-between; margin-bottom: 12px;">
            <button id="saveExitBtn" class="secondary small">💾 save & exit</button>
            <button id="settingsBtnQuiz" class="secondary small">⚙️</button>
        </div>

        <!-- WELCOME SCREEN -->
        <div id="welcomeScreen">
            <h1>📘 Questionaire · recall + fill‑in</h1>
            <div class="file-area-split">
                <div class="file-card">
                    <div class="file-icon">📁</div>
                    <label for="fileInput" class="file-input-label">choose files</label>
                    <input type="file" id="fileInput" accept=".txt,.md,.json,.csv" multiple style="display: none;">
                    <div id="fileList" class="file-list">no files selected</div>
                    <div id="fileLoading" class="hidden" style="text-align:center; margin-top:8px;"><span class="loader"></span> loading...</div>
                </div>
                <div class="paste-card" id="openPasteModalBtn">
                    <div class="paste-icon">📋</div>
                    <span>paste lesson text</span>
                </div>
            </div>

            <div class="inputs-row">
                <div class="input-item">
                    <label for="term-count">terms (10–100)</label>
                    <input type="number" id="term-count" min="10" max="100" value="20" step="1">
                </div>
                <div class="input-item">
                    <label for="max-blanks">max blanks (1–10)</label>
                    <input type="number" id="max-blanks" min="1" max="10" value="5" step="1">
                </div>
            </div>

            <div class="options-row">
                <label class="option-check">
                    <input type="checkbox" id="onlyWrongCheck"> 🔁 only previously wrong
                </label>
                <button id="resumeSessionBtn" class="resume-btn">↻ resume last session</button>
            </div>

            <div id="wrongWarning" class="warning-text hidden">⚠️ no wrong answers stored</div>

            <div style="display: flex; gap: 12px; margin-top: 16px;">
                <button id="startQuizBtn" disabled>▶ start practising</button>
                <button id="resetWrongBtn" class="secondary">🗑️ reset stored wrong</button>
            </div>
        </div>

        <!-- QUIZ SCREEN -->
        <div id="quizScreen" class="hidden">
            <div class="quiz-header">
                <h2 id="lesson-title">lesson</h2>
                <div id="phaseDisplay" class="phase-indicator">recall · write from memory</div>
            </div>
            <div class="progress-container"><div id="progress-fill"></div></div>
            <div id="quizContent" class="term-grid"></div>
            <div class="footer-actions">
                <button id="backToWelcomeBtn" class="secondary" style="display: none;">↩ back</button>
                <button id="hintBtn" class="secondary" style="display: none;">💡 hint</button>
                <button id="checkPhaseBtn">✅ check answers</button>
                <button id="finishPhaseBtn" class="secondary" style="display: none;">🏁 finish</button>
            </div>
        </div>

        <!-- modals -->
        <div id="pasteModal" class="modal hidden" onclick="if(event.target===this) this.classList.add('hidden')">
            <div class="modal-large" onclick="event.stopPropagation()">
                <h3>📋 paste lesson content</h3>
                <textarea id="pasteContent" placeholder="Paste your .txt, .md, .json or .csv content here..."></textarea>
                <div class="modal-actions">
                    <button id="cancelPasteBtn" class="secondary">Cancel</button>
                    <button id="importPasteBtn">Import</button>
                </div>
            </div>
        </div>

        <!-- Title hint modal -->
        <div id="titleHintModal" class="modal hidden" onclick="if(event.target===this) this.classList.add('hidden')">
            <div class="modal-small" onclick="event.stopPropagation()">
                <h3>🔎 hints</h3>
                <div style="display: flex; gap: 8px; margin-bottom: 16px;">
                    <button id="hintPhase1Btn" class="secondary small">💬 Hint (Phase 1)</button>
                    <button id="hintPhase2Btn" class="secondary small">🔤 Hint (Phase 2)</button>
                </div>
                <textarea id="titleHintTextarea" rows="6" readonly placeholder="Hints will appear here..." style="width:100%; padding:12px; border-radius:20px; background:#f8fafc; border:1px solid #cbd5e1; resize: vertical;"></textarea>
                <div class="modal-actions" style="margin-top:16px;">
                    <button class="secondary" onclick="document.getElementById('titleHintModal').classList.add('hidden')">Close</button>
                </div>
            </div>
        </div>

        <!-- Wrong answers list modal -->
        <div id="wrongListModal" class="modal hidden" onclick="if(event.target===this) this.classList.add('hidden')">
            <div class="modal-small" onclick="event.stopPropagation()">
                <h3>❌ wrong answers</h3>
                <div id="wrongListContent" style="max-height:300px; overflow-y:auto; background:#f1f5f9; border-radius:24px; padding:12px; margin-bottom:16px;"></div>
                <div class="modal-actions">
                    <button class="secondary" onclick="document.getElementById('wrongListModal').classList.add('hidden')">Close</button>
                </div>
            </div>
        </div>

        <!-- Recall summary modal -->
        <div id="recallSummaryModal" class="modal hidden" onclick="if(event.target===this) this.classList.add('hidden')">
            <div class="modal-small" onclick="event.stopPropagation()">
                <h3>📊 recall results</h3>
                <p id="recallSummaryText"></p>
                <div class="modal-actions">
                    <button id="continueAfterRecallBtn">Continue to phase 2</button>
                    <button class="secondary" onclick="document.getElementById('recallSummaryModal').classList.add('hidden');">Close</button>
                </div>
            </div>
        </div>

        <!-- Final summary modal -->
        <div id="summaryModal" class="modal hidden" onclick="if(event.target===this) this.classList.add('hidden')">
            <div class="modal-small" onclick="event.stopPropagation()">
                <h3>📊 session summary</h3>
                <p id="summaryText"></p>
                <div class="modal-actions"><button id="summaryOkBtn">OK</button></div>
            </div>
        </div>

        <!-- Error modal -->
        <div id="errorModal" class="modal hidden" onclick="if(event.target===this) this.classList.add('hidden')">
            <div class="modal-small" onclick="event.stopPropagation()">
                <h3>⚠️ parsing errors</h3>
                <div id="errorList" style="max-height:300px; overflow-y:auto;"></div>
                <div class="modal-actions"><button class="secondary" onclick="document.getElementById('errorModal').classList.add('hidden')">Close</button></div>
            </div>
        </div>

        <!-- Image modal -->
        <div id="imageModal" class="modal hidden" onclick="this.classList.add('hidden')">
            <div class="modal-small" style="padding:8px;" onclick="event.stopPropagation()">
                <img id="modalImage" src="" style="width:100%; border-radius:24px;">
            </div>
        </div>

        <!-- Settings modal -->
        <div id="settingsModal" class="modal hidden" onclick="if(event.target===this) this.classList.add('hidden')">
            <div class="modal-large" onclick="event.stopPropagation()">
                <h3>⚙️ settings</h3>
                <div class="settings-row">
                    <label>Partial credit tolerance (Levenshtein):</label>
                    <input type="range" id="levenshteinTolerance" min="0" max="3" value="0" step="1">
                    <span id="levTolValue">0</span>
                </div>
                <div class="settings-row">
                    <label>Custom synonyms (one per line, comma‑separated):</label>
                    <textarea id="customSynonymsInput" rows="4" placeholder="e.g., colour,color&#10;centre,center&#10;behaviour,behavior"></textarea>
                </div>
                <div class="settings-row">
                    <button id="saveSettingsBtn" class="small">Save settings</button>
                </div>
                <div class="modal-actions">
                    <button class="secondary" onclick="document.getElementById('settingsModal').classList.add('hidden')">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // ==================== 1. INDEXEDDB / STORAGE ====================
            const DB_NAME = 'QuizDB';
            const DB_VERSION = 3; // increased, removed ratings store
            const STORE_WRONG = 'wrongSets';
            const STORE_COUNTS = 'correctCounts'; // term index -> streak
            let db = null;

            function openDB() {
                return new Promise((resolve, reject) => {
                    if (db) return resolve(db);
                    if (!window.indexedDB) {
                        reject(new Error('IndexedDB not supported'));
                        return;
                    }
                    const request = indexedDB.open(DB_NAME, DB_VERSION);
                    request.onerror = () => reject(request.error);
                    request.onsuccess = () => { db = request.result; resolve(db); };
                    request.onupgradeneeded = (e) => {
                        const db = e.target.result;
                        if (!db.objectStoreNames.contains(STORE_WRONG)) {
                            db.createObjectStore(STORE_WRONG, { keyPath: 'id' });
                        }
                        if (!db.objectStoreNames.contains(STORE_COUNTS)) {
                            db.createObjectStore(STORE_COUNTS, { keyPath: 'id' });
                        }
                        // delete old ratings store if exists
                        if (db.objectStoreNames.contains('termRatings')) {
                            db.deleteObjectStore('termRatings');
                        }
                    };
                });
            }

            async function getStoreData(storeName, id) {
                try {
                    await openDB();
                    return new Promise((resolve, reject) => {
                        if (!db) {
                            reject(new Error('Database not available'));
                            return;
                        }
                        const tx = db.transaction(storeName, 'readonly');
                        const store = tx.objectStore(storeName);
                        const req = store.get(id);
                        req.onsuccess = () => resolve(req.result ? req.result.data : null);
                        req.onerror = () => reject(req.error);
                    });
                } catch (e) {
                    console.warn(`IndexedDB error in getStoreData (${storeName}):`, e);
                    return null; // return null to indicate failure
                }
            }

            async function putStoreData(storeName, id, data) {
                try {
                    await openDB();
                    return new Promise((resolve, reject) => {
                        if (!db) {
                            reject(new Error('Database not available'));
                            return;
                        }
                        const tx = db.transaction(storeName, 'readwrite');
                        const store = tx.objectStore(storeName);
                        const req = store.put({ id, data });
                        req.onsuccess = () => resolve();
                        req.onerror = () => reject(req.error);
                    });
                } catch (e) {
                    console.warn(`IndexedDB error in putStoreData (${storeName}):`, e);
                    // Fail silently – data not saved
                }
            }

            // Wrapper for wrong sets (as Set)
            async function getWrongSet(id) {
                const data = await getStoreData(STORE_WRONG, id);
                return data ? new Set(data) : new Set();
            }
            async function saveWrongSet(id, set) {
                await putStoreData(STORE_WRONG, id, Array.from(set));
            }

            // Correct counts (streak) per term
            async function getCorrectCounts(id) {
                const data = await getStoreData(STORE_COUNTS, id);
                return data ? new Map(data) : new Map();
            }
            async function saveCorrectCounts(id, map) {
                await putStoreData(STORE_COUNTS, id, Array.from(map.entries()));
            }

            // ==================== 2. CUSTOM SYNONYMS (localStorage) ====================
            let customSynonyms = new Map(); // normalized word -> Set of normalized synonyms
            function loadCustomSynonyms() {
                try {
                    const saved = localStorage.getItem('customSynonyms');
                    if (saved) {
                        const obj = JSON.parse(saved);
                        customSynonyms = new Map(Object.entries(obj).map(([k, v]) => [k, new Set(v)]));
                    }
                } catch (e) {}
            }
            function saveCustomSynonyms() {
                const obj = {};
                for (let [k, v] of customSynonyms.entries()) {
                    obj[k] = Array.from(v);
                }
                localStorage.setItem('customSynonyms', JSON.stringify(obj));
            }
            loadCustomSynonyms();

            // ==================== 3. BUILT‑IN SYNONYMS ====================
            const builtinSynonyms = new Map([
                ['cell', ['cells', 'cellular']],
                ['cells', ['cell', 'cellular']],
                ['cellular', ['cell', 'cells']],
                ['tissue', ['tissues', 'tissular']],
                ['tissues', ['tissue', 'tissular']],
                ['protein', ['proteins', 'proteic']],
                ['proteins', ['protein', 'proteic']],
                ['enzyme', ['enzymes', 'enzymatic']],
                ['enzymes', ['enzyme', 'enzymatic']],
                ['receptor', ['receptors', 'receptive']],
                ['receptors', ['receptor', 'receptive']],
                ['immune', ['immunity', 'immunological']],
                ['immunity', ['immune', 'immunological']],
                ['immunological', ['immune', 'immunity']],
                ['bacteria', ['bacterium', 'bacterial']],
                ['bacterium', ['bacteria', 'bacterial']],
                ['bacterial', ['bacteria', 'bacterium']],
                ['fungus', ['fungi', 'fungal']],
                ['fungi', ['fungus', 'fungal']],
                ['fungal', ['fungus', 'fungi']],
                ['virus', ['viruses', 'viral']],
                ['viruses', ['virus', 'viral']],
                ['viral', ['virus', 'viruses']],
                ['infection', ['infections', 'infectious']],
                ['infections', ['infection', 'infectious']],
                ['infectious', ['infection', 'infections']],
            ]);

            function getSynonyms(word) {
                const norm = normalizeWord(word);
                const builtin = builtinSynonyms.get(norm) || [];
                const custom = customSynonyms.get(norm) || [];
                return new Set([norm, ...builtin.map(s => normalizeWord(s)), ...custom]);
            }

            // ==================== 4. LEVENSHTEIN ====================
            function levenshtein(a, b) {
                if (a.length === 0) return b.length;
                if (b.length === 0) return a.length;
                const matrix = [];
                for (let i = 0; i <= b.length; i++) matrix[i] = [i];
                for (let j = 0; j <= a.length; j++) matrix[0][j] = j;
                for (let i = 1; i <= b.length; i++) {
                    for (let j = 1; j <= a.length; j++) {
                        if (b.charAt(i-1) === a.charAt(j-1)) {
                            matrix[i][j] = matrix[i-1][j-1];
                        } else {
                            matrix[i][j] = Math.min(matrix[i-1][j-1] + 1,
                                                    matrix[i][j-1] + 1,
                                                    matrix[i-1][j] + 1);
                        }
                    }
                }
                return matrix[b.length][a.length];
            }

            // ==================== 5. OTHER UTILITIES ====================
            function normalizeWord(word) {
                return word.replace(/^[.,!?;:()"'\s]+|[.,!?;:()"'\s]+$/g, '').toLowerCase();
            }

            function escapeRegExp(str) {
                return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            }

            function escapeHTML(str) {
                return String(str).replace(/[&<>"]/g, m => {
                    if (m === '&') return '&amp;';
                    if (m === '<') return '&lt;';
                    if (m === '>') return '&gt;';
                    if (m === '"') return '&quot;';
                    return m;
                });
            }

            function formatInline(text) {
                return text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                           .replace(/\*(.*?)\*/g, '<em>$1</em>');
            }

            // ==================== 6. OCCURRENCE DETECTION ====================
            function isWordChar(ch) {
                return /[\p{L}\p{N}_]/u.test(ch);
            }
            function isWordBoundaryLeft(text, pos) {
                if (pos === 0) return true;
                return !isWordChar(text[pos - 1]);
            }
            function isWordBoundaryRight(text, pos) {
                if (pos >= text.length) return true;
                return !isWordChar(text[pos]);
            }

            function findOccurrences(sentence, chosenWords, immortalWords) {
                const lowerSentence = sentence.toLowerCase();
                const immortalsLower = new Set(immortalWords.map(w => normalizeWord(w)));
                const occurrences = [];
                const escaped = chosenWords.map(w => escapeRegExp(normalizeWord(w))).join('|');
                if (!escaped) return [];
                const regex = new RegExp(`(${escaped})`, 'gi');
                let match;
                while ((match = regex.exec(lowerSentence)) !== null) {
                    const matchedWord = match[0];
                    const start = match.index;
                    const end = start + matchedWord.length;
                    if (isWordBoundaryLeft(lowerSentence, start) && isWordBoundaryRight(lowerSentence, end)) {
                        if (!immortalsLower.has(matchedWord)) {
                            const originalWord = chosenWords.find(w => normalizeWord(w) === matchedWord) || matchedWord;
                            occurrences.push({
                                word: sentence.substr(start, matchedWord.length),
                                index: start,
                                length: matchedWord.length,
                                originalWord: originalWord
                            });
                        }
                    }
                    regex.lastIndex = end;
                }
                return occurrences;
            }

            // ==================== 7. PARSER ====================
            function parseLessonFromText(content, fileName = 'pasted') {
                const errors = [];
                if (content.charCodeAt(0) === 0xFEFF) content = content.slice(1);
                const ext = fileName.split('.').pop().toLowerCase();

                if (ext === 'json') {
                    try {
                        const data = JSON.parse(content);
                        return { lesson: data, errors };
                    } catch (e) {
                        errors.push('Invalid JSON file: ' + e.message);
                        return { lesson: null, errors };
                    }
                } else if (ext === 'csv') {
                    const lines = content.split('\n').map(l => l.trim()).filter(l => l);
                    if (lines.length < 2) {
                        errors.push('CSV file must have at least a header line and one data line.');
                        return { lesson: null, errors };
                    }
                    const headers = lines[0].split(',').map(h => h.trim());
                    const terms = [];
                    for (let i = 1; i < lines.length; i++) {
                        const values = lines[i].split(',').map(v => v.trim());
                        let term = { term: '', sentence: '', chosen: [], immortal: [], image: '', hint: '', audio: '', video: '', mermaid: '' };
                        headers.forEach((h, idx) => {
                            const val = values[idx] || '';
                            if (h === 'term') term.term = val;
                            else if (h === 'sentence') term.sentence = val;
                            else if (h === 'chosen') term.chosen = val ? val.split('|').map(s => s.trim()) : [];
                            else if (h === 'immortal') term.immortal = val ? val.split(',').map(s => s.trim()) : [];
                            else if (h === 'image') term.image = val;
                            else if (h === 'hint') term.hint = val;
                            else if (h === 'audio') term.audio = val;
                            else if (h === 'video') term.video = val;
                            else if (h === 'mermaid') term.mermaid = val;
                        });
                        if (term.sentence && term.chosen.length) {
                            term.acceptable = buildAcceptableSet(term);
                            terms.push(term);
                        } else {
                            errors.push(`Line ${i+1}: missing Sentence or Chosen.`);
                        }
                    }
                    return { lesson: { title: fileName.replace('.csv',''), terms }, errors };
                } else {
                    // Assume plain text / markdown
                    const lines = content.split('\n');
                    let title = 'Untitled';
                    const terms = [];
                    let currentTerm = null;
                    let lineNum = 0;

                    for (let line of lines) {
                        lineNum++;
                        line = line.trim();
                        if (line.startsWith('# ')) {
                            title = line.substring(2).trim();
                        } else if (line.startsWith('- ')) {
                            if (currentTerm) {
                                if (!currentTerm.sentence) {
                                    errors.push(`Line ${lineNum-1}: Term "${currentTerm.term}" has no Sentence.`);
                                } else {
                                    currentTerm.acceptable = buildAcceptableSet(currentTerm);
                                    terms.push(currentTerm);
                                }
                            }
                            currentTerm = {
                                term: line.substring(2).trim(),
                                sentence: '',
                                chosen: [],
                                immortal: [],
                                image: '',
                                hint: '',
                                audio: '',
                                video: '',
                                mermaid: '',
                                acceptable: new Set()
                            };
                        } else if (currentTerm) {
                            if (line.startsWith('Sentence:')) {
                                currentTerm.sentence = line.substring(9).trim();
                            } else if (line.startsWith('Chosen:')) {
                                const raw = line.substring(7).trim();
                                if (raw) {
                                    currentTerm.chosen = raw.split(',').flatMap(part =>
                                        part.trim().split('|').map(s => s.trim())
                                    ).filter(s => s.length > 0);
                                }
                            } else if (line.startsWith('Immortal:')) {
                                currentTerm.immortal = line.substring(9).trim().split(',').map(s => s.trim());
                            } else if (line.startsWith('Image:')) {
                                currentTerm.image = line.substring(6).trim();
                            } else if (line.startsWith('Hint:')) {
                                currentTerm.hint = line.substring(5).trim();
                            } else if (line.startsWith('Audio:')) {
                                currentTerm.audio = line.substring(6).trim();
                            } else if (line.startsWith('Video:')) {
                                currentTerm.video = line.substring(6).trim();
                            } else if (line.startsWith('Mermaid:')) {
                                currentTerm.mermaid = line.substring(8).trim();
                            }
                        }
                    }
                    if (currentTerm) {
                        if (!currentTerm.sentence) {
                            errors.push(`Line ${lines.length}: Term "${currentTerm.term}" has no Sentence.`);
                        } else {
                            currentTerm.acceptable = buildAcceptableSet(currentTerm);
                            terms.push(currentTerm);
                        }
                    }
                    if (terms.length === 0) {
                        errors.push('No valid terms found. Use "- " for terms.');
                    }
                    return { lesson: { title, terms }, errors };
                }
            }

            function buildAcceptableSet(term) {
                const set = new Set();
                term.chosen.forEach(w => set.add(normalizeWord(w)));
                term.chosen.forEach(w => {
                    const syn = getSynonyms(w);
                    syn.forEach(s => set.add(s));
                });
                return set;
            }

            // ==================== 8. STATE VARIABLES ====================
            let currentLesson = null;
            let currentFileIdentifier = '';
            let currentTermsIndices = [];
            let phase = 'recall'; // recall, initial, remedial, reveal
            let wrongIndicesGlobal = new Set(); // terms in wrong set (need practice)
            let correctStreakMap = new Map();    // term index -> current correct streak (for removal after 3)
            let maxBlanks = 5;
            let sessionWrongCount = 0;
            let sessionTotalCount = 0;
            let levenshteinTolerance = 0; // from settings

            // DOM elements (will be filled after DOM ready)
            // We'll fetch them inside the DOMContentLoaded callback

            // ==================== 9. LOAD / SAVE PERSISTENT DATA ====================
            async function loadPersistentData(identifier) {
                wrongIndicesGlobal = await getWrongSet(identifier);
                const counts = await getCorrectCounts(identifier);
                correctStreakMap = counts;
            }

            async function savePersistentData(identifier) {
                await saveWrongSet(identifier, wrongIndicesGlobal);
                await saveCorrectCounts(identifier, correctStreakMap);
            }

            // ==================== 10. RENDERING ====================
            function shuffleArray(arr) {
                for (let i = arr.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [arr[i], arr[j]] = [arr[j], arr[i]];
                }
                return arr;
            }

            function renderQuiz() {
                if (!currentLesson) return;
                const terms = currentLesson.terms;
                let indices = [...currentTermsIndices];
                if (phase !== 'recall') {
                    // shuffle for anti-cheat
                    indices = shuffleArray(indices);
                }
                sessionTotalCount = indices.length;

                let html = '';

                for (let i = 0; i < indices.length; i++) {
                    const termIdx = indices[i];
                    const term = terms[termIdx];

                    if (phase === 'recall') {
                        // Phase 1: term input + definition textarea (no rating buttons)
                        html += `
                            <div class="term-card" data-term-idx="${termIdx}">
                                <input type="text" class="term-title-input" data-term-idx="${termIdx}" placeholder="Enter term" value="${escapeHTML(term.userTerm || '')}">
                                <textarea class="recall-textarea" data-term-idx="${termIdx}" placeholder="Write the full sentence from memory...">${term.userRecall || ''}</textarea>
                                ${term.image ? `<img class="term-image" src="${escapeHTML(term.image)}" alt="lesson image" onerror="this.style.display='none'" onclick="showImageModal('${escapeHTML(term.image)}')">` : ''}
                                ${term.video ? renderVideo(term.video) : ''}
                                ${term.mermaid ? `<div class="mermaid">${escapeHTML(term.mermaid)}</div>` : ''}
                            </div>
                        `;
                    } else {
                        // Phase 2,3,4: fill-in or reveal
                        let sentence = term.sentence || '';
                        let chosen = term.chosen.length ? term.chosen : (term.term ? [term.term] : []);
                        const immortal = term.immortal || [];

                        const occurrences = (phase !== 'reveal') ? findOccurrences(sentence, chosen, immortal) : [];

                        let hiddenIndices = new Set();
                        if (phase === 'initial') {
                            occurrences.forEach((_, idx) => hiddenIndices.add(idx));
                        } else if (phase === 'remedial') {
                            if (occurrences.length > 0) {
                                const max = Math.min(maxBlanks, occurrences.length);
                                const numHide = Math.floor(Math.random() * max) + 1;
                                const shuffled = [...Array(occurrences.length).keys()].sort(() => Math.random() - 0.5);
                                for (let j = 0; j < numHide; j++) hiddenIndices.add(shuffled[j]);
                            }
                        }

                        let sentenceHTML = '';
                        if (phase === 'reveal') {
                            sentenceHTML = `<div class="sentence-box">${formatInline(sentence)}</div>`;
                        } else {
                            let cursor = 0;
                            let result = '';
                            for (let j = 0; j < occurrences.length; j++) {
                                const occ = occurrences[j];
                                if (cursor < occ.index) {
                                    result += escapeHTML(sentence.substring(cursor, occ.index));
                                }
                                if (hiddenIndices.has(j)) {
                                    result += `<span class="blank-input">`;
                                    result += `<input type="text" data-term-idx="${termIdx}" data-expected="${occ.word}" placeholder="..." value="">`;
                                    if (term.hint && phase === 'remedial') {
                                        result += `<span class="hint-icon" title="${escapeHTML(term.hint)}" onclick="alert('Hint: ${escapeHTML(term.hint)}')">?</span>`;
                                    }
                                    result += `</span>`;
                                } else {
                                    result += `<span style="font-weight:600;">${escapeHTML(occ.word)}</span>`;
                                }
                                cursor = occ.index + occ.length;
                            }
                            if (cursor < sentence.length) {
                                result += escapeHTML(sentence.substring(cursor));
                            }
                            sentenceHTML = `<div class="sentence-box">${result}</div>`;
                        }

                        const imageHtml = term.image ? `<img class="term-image" src="${escapeHTML(term.image)}" alt="lesson image" onerror="this.style.display='none'" onclick="showImageModal('${escapeHTML(term.image)}')">` : '';
                        const videoHtml = term.video ? renderVideo(term.video) : '';
                        const mermaidHtml = term.mermaid ? `<div class="mermaid">${escapeHTML(term.mermaid)}</div>` : '';

                        // No term title in phase 2/3/4
                        html += `
                            <div class="term-card" data-term-idx="${termIdx}">
                                ${imageHtml}
                                ${videoHtml}
                                ${mermaidHtml}
                                ${sentenceHTML}
                            </div>
                        `;
                    }
                }

                document.getElementById('quizContent').innerHTML = html;
                updateProgress();
                setAriaLabels();

                // Apply syntax highlighting and math after render
                if (window.hljs) document.querySelectorAll('pre code').forEach(block => hljs.highlightBlock(block));
                if (window.renderMathInElement) {
                    renderMathInElement(document.querySelector('.sentence-box'), {
                        delimiters: [
                            { left: '$$', right: '$$', display: true },
                            { left: '$', right: '$', display: false }
                        ]
                    });
                }
                if (window.mermaid) mermaid.run();
            }

            function renderVideo(url) {
                // Simple YouTube embed if youtube.com or youtu.be
                if (url.includes('youtube.com/watch') || url.includes('youtu.be')) {
                    let videoId = '';
                    if (url.includes('youtu.be')) videoId = url.split('/').pop().split('?')[0];
                    else videoId = new URL(url).searchParams.get('v');
                    if (videoId) return `<iframe width="100%" height="200" src="https://www.youtube.com/embed/${videoId}" frameborder="0" allowfullscreen></iframe>`;
                }
                return `<a href="${escapeHTML(url)}" target="_blank">📺 watch video</a>`;
            }

            // ==================== 11. PROGRESS (with pulse) ====================
            function updateProgress() {
                const fill = document.getElementById('progress-fill');
                if (phase === 'recall') {
                    const inputs = document.querySelectorAll('.term-title-input');
                    const textareas = document.querySelectorAll('.recall-textarea');
                    const total = inputs.length; // assume same count
                    if (total === 0) { fill.style.width = '0%'; return; }
                    let filled = 0;
                    inputs.forEach(inp => { if (inp.value.trim() !== '') filled++; });
                    textareas.forEach(ta => { if (ta.value.trim() !== '') filled++; });
                    const percent = (filled / (total*2)) * 100;
                    fill.style.width = percent + '%';
                } else {
                    const inputs = document.querySelectorAll('.blank-input input');
                    const total = inputs.length;
                    if (total === 0) { fill.style.width = '0%'; return; }
                    let filled = 0;
                    inputs.forEach(inp => { if (inp.value.trim() !== '') filled++; });
                    const percent = (filled / total) * 100;
                    fill.style.width = percent + '%';
                }
                // Add pulse class
                fill.classList.add('progress-pulse');
                setTimeout(() => fill.classList.remove('progress-pulse'), 500);
            }

            // ==================== 12. CHECK ANSWERS ====================
            async function checkAnswers() {
                if (!currentLesson) return;

                if (phase === 'recall') {
                    // Compare term input and definition textarea
                    const termInputs = document.querySelectorAll('.term-title-input');
                    const defTextareas = document.querySelectorAll('.recall-textarea');
                    let correctCount = 0;
                    const wrongInRecall = [];

                    for (let i = 0; i < termInputs.length; i++) {
                        const inp = termInputs[i];
                        const ta = defTextareas[i];
                        const termIdx = parseInt(inp.dataset.termIdx);
                        const term = currentLesson.terms[termIdx];
                        const userTerm = inp.value.trim().toLowerCase().replace(/\s+/g, ' ');
                        const actualTerm = term.term.toLowerCase().replace(/\s+/g, ' ');
                        const userDef = ta.value.trim().toLowerCase().replace(/\s+/g, ' ');
                        const actualDef = term.sentence.toLowerCase().replace(/\s+/g, ' ');
                        // Normalize further (remove punctuation)
                        const userTermNorm = userTerm.replace(/[.,!?;:]/g, '');
                        const actualTermNorm = actualTerm.replace(/[.,!?;:]/g, '');
                        const userDefNorm = userDef.replace(/[.,!?;:]/g, '');
                        const actualDefNorm = actualDef.replace(/[.,!?;:]/g, '');

                        const termCorrect = (userTermNorm === actualTermNorm) || (levenshtein(userTermNorm, actualTermNorm) <= levenshteinTolerance);
                        const defCorrect = (userDefNorm === actualDefNorm) || (levenshtein(userDefNorm, actualDefNorm) <= levenshteinTolerance);

                        if (termCorrect && defCorrect) {
                            inp.classList.add('correct-highlight');
                            ta.classList.add('correct-highlight');
                            inp.classList.remove('wrong-highlight');
                            ta.classList.remove('wrong-highlight');
                            correctCount++;
                            // Increase streak, if reaches 3 remove from wrong set
                            let streak = correctStreakMap.get(termIdx) || 0;
                            streak++;
                            correctStreakMap.set(termIdx, streak);
                            if (streak >= 3) {
                                wrongIndicesGlobal.delete(termIdx);
                            }
                        } else {
                            inp.classList.add('wrong-highlight');
                            ta.classList.add('wrong-highlight');
                            inp.classList.remove('correct-highlight');
                            ta.classList.remove('correct-highlight');
                            wrongInRecall.push(termIdx);
                            // reset streak
                            correctStreakMap.set(termIdx, 0);
                            // Show "did you mean?" if close
                            if (!termCorrect && levenshtein(userTermNorm, actualTermNorm) <= 2) {
                                alert(`Did you mean "${term.term}"?`);
                            }
                            if (!defCorrect && levenshtein(userDefNorm, actualDefNorm) <= 2) {
                                alert(`Did you mean "${term.sentence}"?`);
                            }
                        }
                    }

                    // Update global wrong set
                    wrongInRecall.forEach(idx => wrongIndicesGlobal.add(idx));
                    await savePersistentData(currentFileIdentifier);

                    // Show recall summary
                    document.getElementById('recallSummaryText').innerText = `You got ${correctCount} out of ${termInputs.length} correct.`;
                    document.getElementById('recallSummaryModal').classList.remove('hidden');

                    // Store the list of wrong terms for phase 2
                    currentTermsIndices = wrongInRecall; // only wrong ones go to phase 2
                }
                else if (phase === 'initial') {
                    // Only wrong terms are present (currentTermsIndices already filtered)
                    const wrongIndices = [];
                    const cards = document.querySelectorAll('.term-card');
                    cards.forEach(card => {
                        const termIdx = parseInt(card.dataset.termIdx);
                        const term = currentLesson.terms[termIdx];
                        const inputs = card.querySelectorAll('.blank-input input');
                        let correct = true;
                        inputs.forEach(inp => {
                            const expected = inp.dataset.expected;
                            const val = inp.value.trim();
                            const userNorm = normalizeWord(val);
                            const acceptable = term.acceptable;
                            if (!acceptable.has(userNorm) && !acceptable.has(normalizeWord(expected))) {
                                // Check Levenshtein tolerance
                                const isClose = Array.from(acceptable).some(acc => levenshtein(userNorm, acc) <= levenshteinTolerance);
                                if (!isClose) {
                                    correct = false;
                                    inp.classList.add('wrong-highlight');
                                    // Show hint if close to any acceptable
                                    const closest = Array.from(acceptable).find(acc => levenshtein(userNorm, acc) <= 2);
                                    if (closest) alert(`Did you mean "${closest}"?`);
                                } else {
                                    inp.classList.add('correct-highlight');
                                }
                            } else {
                                inp.classList.add('correct-highlight');
                            }
                        });
                        if (!correct) wrongIndices.push(termIdx);
                    });

                    if (wrongIndices.length === 0) {
                        sessionWrongCount = 0;
                        phase = 'reveal';
                        renderQuiz();
                    } else {
                        currentTermsIndices = wrongIndices;
                        phase = 'remedial';
                        renderQuiz();
                    }
                    saveSession();
                }
                else if (phase === 'remedial') {
                    const correctInRemedial = [];
                    const wrongInRemedial = [];
                    const cards = document.querySelectorAll('.term-card');
                    cards.forEach(card => {
                        const termIdx = parseInt(card.dataset.termIdx);
                        const term = currentLesson.terms[termIdx];
                        const inputs = card.querySelectorAll('.blank-input input');
                        let correct = true;
                        inputs.forEach(inp => {
                            const expected = inp.dataset.expected;
                            const val = inp.value.trim();
                            const userNorm = normalizeWord(val);
                            const acceptable = term.acceptable;
                            if (!acceptable.has(userNorm) && !acceptable.has(normalizeWord(expected))) {
                                const isClose = Array.from(acceptable).some(acc => levenshtein(userNorm, acc) <= levenshteinTolerance);
                                if (!isClose) {
                                    correct = false;
                                    inp.classList.add('wrong-highlight');
                                } else {
                                    inp.classList.add('correct-highlight');
                                }
                            } else {
                                inp.classList.add('correct-highlight');
                            }
                        });
                        if (correct) correctInRemedial.push(termIdx);
                        else wrongInRemedial.push(termIdx);
                    });

                    sessionWrongCount = wrongInRemedial.length;
                    correctInRemedial.forEach(idx => {
                        // increase streak
                        let streak = correctStreakMap.get(idx) || 0;
                        streak++;
                        correctStreakMap.set(idx, streak);
                        if (streak >= 3) wrongIndicesGlobal.delete(idx);
                    });
                    wrongInRemedial.forEach(idx => {
                        wrongIndicesGlobal.add(idx);
                        correctStreakMap.set(idx, 0);
                    });
                    await savePersistentData(currentFileIdentifier);

                    phase = 'reveal';
                    renderQuiz();
                    saveSession();
                }
            }

            // ==================== 13. SAVE & EXIT ====================
            function saveCurrentState() {
                if (!currentLesson) return;
                const state = {
                    fileIdentifier: currentFileIdentifier,
                    lessonTitle: currentLesson.title,
                    indices: currentTermsIndices,
                    phase: phase,
                    userAnswers: {} // store per term inputs
                };
                // Gather all inputs
                if (phase === 'recall') {
                    const termInputs = document.querySelectorAll('.term-title-input');
                    const defTextareas = document.querySelectorAll('.recall-textarea');
                    state.userAnswers.recall = [];
                    termInputs.forEach(inp => {
                        const termIdx = inp.dataset.termIdx;
                        const ta = document.querySelector(`.recall-textarea[data-term-idx="${termIdx}"]`);
                        state.userAnswers.recall.push({ termIdx: parseInt(termIdx), termVal: inp.value, defVal: ta ? ta.value : '' });
                    });
                } else {
                    const blanks = document.querySelectorAll('.blank-input input');
                    state.userAnswers.blanks = [];
                    blanks.forEach(inp => {
                        const termIdx = inp.dataset.termIdx;
                        state.userAnswers.blanks.push({ termIdx: parseInt(termIdx), val: inp.value });
                    });
                }
                localStorage.setItem('quiz_savedState', JSON.stringify(state));
                alert('Progress saved. You can resume later via "resume last session".');
            }

            async function loadSavedState() {
                const saved = localStorage.getItem('quiz_savedState');
                if (!saved) return null;
                try {
                    const state = JSON.parse(saved);
                    // Need to reload lesson
                    const cached = loadCachedLesson();
                    if (!cached || cached.identifier !== state.fileIdentifier) {
                        alert('Saved lesson not found in cache. Please reload the lesson first.');
                        return null;
                    }
                    await loadLesson(cached.lesson, cached.identifier, cached.fileNames);
                    currentTermsIndices = state.indices;
                    phase = state.phase;
                    renderQuiz();
                    // Restore answers
                    if (phase === 'recall' && state.userAnswers.recall) {
                        state.userAnswers.recall.forEach(item => {
                            const inp = document.querySelector(`.term-title-input[data-term-idx="${item.termIdx}"]`);
                            const ta = document.querySelector(`.recall-textarea[data-term-idx="${item.termIdx}"]`);
                            if (inp) inp.value = item.termVal;
                            if (ta) ta.value = item.defVal;
                        });
                    } else if (state.userAnswers.blanks) {
                        state.userAnswers.blanks.forEach(item => {
                            const inp = document.querySelector(`.blank-input input[data-term-idx="${item.termIdx}"]`);
                            if (inp) inp.value = item.val;
                        });
                    }
                    return true;
                } catch (e) {
                    console.error('Failed to load saved state', e);
                    return null;
                }
            }

            // ==================== 14. MAIN INITIALIZATION ====================
            window.addEventListener('DOMContentLoaded', () => {
                // Get DOM elements
                const topBarWelcome = document.getElementById('topBarWelcome');
                const topBarQuiz = document.getElementById('topBarQuiz');
                const welcomeScreen = document.getElementById('welcomeScreen');
                const quizScreen = document.getElementById('quizScreen');
                const fileInput = document.getElementById('fileInput');
                const fileListDiv = document.getElementById('fileList');
                const fileLoading = document.getElementById('fileLoading');
                const termCountInput = document.getElementById('term-count');
                const maxBlanksInput = document.getElementById('max-blanks');
                const onlyWrongCheck = document.getElementById('onlyWrongCheck');
                const wrongWarning = document.getElementById('wrongWarning');
                const startBtn = document.getElementById('startQuizBtn');
                const resetWrongBtn = document.getElementById('resetWrongBtn');
                const showWrongBtn = document.getElementById('showWrongBtn');
                const resumeBtn = document.getElementById('resumeSessionBtn');
                const openPasteModalBtn = document.getElementById('openPasteModalBtn');
                const pasteModal = document.getElementById('pasteModal');
                const cancelPasteBtn = document.getElementById('cancelPasteBtn');
                const importPasteBtn = document.getElementById('importPasteBtn');
                const pasteContent = document.getElementById('pasteContent');
                const lessonTitleSpan = document.getElementById('lesson-title');
                const hintBtn = document.getElementById('hintBtn');
                const backBtn = document.getElementById('backToWelcomeBtn');
                const checkBtn = document.getElementById('checkPhaseBtn');
                const finishBtn = document.getElementById('finishPhaseBtn');
                const phaseDisplay = document.getElementById('phaseDisplay');
                const progressFill = document.getElementById('progress-fill');
                const quizContent = document.getElementById('quizContent');
                const hintModal = document.getElementById('hintModal');
                const hiddenTermsList = document.getElementById('hiddenTermsList');
                const summaryModal = document.getElementById('summaryModal');
                const summaryText = document.getElementById('summaryText');
                const summaryOkBtn = document.getElementById('summaryOkBtn');
                const imageModal = document.getElementById('imageModal');
                const modalImage = document.getElementById('modalImage');
                const errorModal = document.getElementById('errorModal');
                const errorList = document.getElementById('errorList');
                const titleHintModal = document.getElementById('titleHintModal');
                const hintPhase1Btn = document.getElementById('hintPhase1Btn');
                const hintPhase2Btn = document.getElementById('hintPhase2Btn');
                const titleHintTextarea = document.getElementById('titleHintTextarea');
                const wrongListModal = document.getElementById('wrongListModal');
                const wrongListContent = document.getElementById('wrongListContent');
                const recallSummaryModal = document.getElementById('recallSummaryModal');
                const recallSummaryText = document.getElementById('recallSummaryText');
                const continueAfterRecallBtn = document.getElementById('continueAfterRecallBtn');
                const saveExitBtn = document.getElementById('saveExitBtn');
                const settingsBtn = document.getElementById('settingsBtn');
                const settingsBtnQuiz = document.getElementById('settingsBtnQuiz');
                const settingsModal = document.getElementById('settingsModal');
                const levenshteinToleranceInput = document.getElementById('levenshteinTolerance');
                const levTolValue = document.getElementById('levTolValue');
                const customSynonymsInput = document.getElementById('customSynonymsInput');
                const saveSettingsBtn = document.getElementById('saveSettingsBtn');

                // ========== SETTINGS ==========
                levenshteinToleranceInput.addEventListener('input', () => {
                    levTolValue.innerText = levenshteinToleranceInput.value;
                    levenshteinTolerance = parseInt(levenshteinToleranceInput.value);
                });
                saveSettingsBtn.addEventListener('click', () => {
                    // Save custom synonyms
                    const text = customSynonymsInput.value.trim();
                    customSynonyms.clear();
                    if (text) {
                        const lines = text.split('\n');
                        lines.forEach(line => {
                            const parts = line.split(',').map(s => s.trim().toLowerCase());
                            if (parts.length >= 2) {
                                const main = parts[0];
                                const syns = parts.slice(1);
                                if (!customSynonyms.has(main)) customSynonyms.set(main, new Set());
                                syns.forEach(s => customSynonyms.get(main).add(s));
                            }
                        });
                    }
                    saveCustomSynonyms();
                    levenshteinTolerance = parseInt(levenshteinToleranceInput.value);
                    settingsModal.classList.add('hidden');
                });

                settingsBtn.addEventListener('click', () => {
                    // Load current settings into modal
                    levTolValue.innerText = levenshteinTolerance;
                    levenshteinToleranceInput.value = levenshteinTolerance;
                    // Load custom synonyms as text
                    const lines = [];
                    for (let [k, v] of customSynonyms.entries()) {
                        lines.push(k + ',' + Array.from(v).join(','));
                    }
                    customSynonymsInput.value = lines.join('\n');
                    settingsModal.classList.remove('hidden');
                });
                settingsBtnQuiz.addEventListener('click', () => settingsBtn.click());

                // ========== SAVE & EXIT ==========
                saveExitBtn.addEventListener('click', saveCurrentState);

                // ========== RESUME ==========
                resumeBtn.addEventListener('click', async () => {
                    // Try to load saved state first
                    const loaded = await loadSavedState();
                    if (!loaded) {
                        // Fallback to cached lesson
                        const cached = loadCachedLesson();
                        if (!cached) {
                            alert('No previous session found.');
                            return;
                        }
                        await loadLesson(cached.lesson, cached.identifier, cached.fileNames);
                    }
                    quizScreen.classList.remove('hidden');
                    welcomeScreen.classList.add('hidden');
                    topBarWelcome.style.display = 'none';
                    topBarQuiz.style.display = 'flex';
                });

                // ========== SHOW WRONG ANSWERS ==========
                showWrongBtn.addEventListener('click', () => {
                    if (!currentLesson) {
                        wrongListContent.innerHTML = '<p>No lesson loaded.</p>';
                    } else {
                        const terms = currentLesson.terms;
                        const wrongItems = [];
                        const attentionItems = [];
                        for (let idx of wrongIndicesGlobal) {
                            if (idx >= terms.length) continue;
                            const term = terms[idx].term;
                            const streak = correctStreakMap.get(idx) || 0;
                            if (streak >= 3) continue; // shouldn't happen, but just in case
                            if (streak === 0) wrongItems.push(term);
                            else attentionItems.push(term);
                        }
                        let html = '<div class="wrong-category"><h4>❌ wrong (0 correct streak)</h4>';
                        wrongItems.forEach(t => html += `<div class="wrong-item">${escapeHTML(t)}</div>`);
                        html += '</div><div class="wrong-category"><h4>🟠 needs more attention (1-2 correct)</h4>';
                        attentionItems.forEach(t => html += `<div class="wrong-item orange">${escapeHTML(t)}</div>`);
                        html += '</div>';
                        wrongListContent.innerHTML = html || '<p>No wrong answers.</p>';
                    }
                    wrongListModal.classList.remove('hidden');
                });

                // ========== HINT BUTTON (original) ==========
                hintBtn.addEventListener('click', () => {
                    if (phase === 'remedial') showHiddenTerms();
                    else alert('Hint only in phase 3');
                });

                // ========== TITLE CLICK ==========
                lessonTitleSpan.addEventListener('click', () => {
                    titleHintModal.classList.remove('hidden');
                    if (phase === 'recall') {
                        hintPhase1Btn.style.display = 'inline-block';
                        hintPhase2Btn.style.display = 'none';
                    } else if (phase === 'initial' || phase === 'remedial') {
                        hintPhase1Btn.style.display = 'none';
                        hintPhase2Btn.style.display = 'inline-block';
                    } else {
                        hintPhase1Btn.style.display = 'none';
                        hintPhase2Btn.style.display = 'none';
                    }
                });

                hintPhase1Btn.addEventListener('click', () => {
                    if (!currentLesson) return;
                    const titles = currentTermsIndices.map(idx => currentLesson.terms[idx].term);
                    titleHintTextarea.value = titles.join('\n');
                });

                hintPhase2Btn.addEventListener('click', () => {
                    const inputs = document.querySelectorAll('.blank-input input');
                    const expected = Array.from(inputs).map(inp => inp.dataset.expected).filter(Boolean);
                    titleHintTextarea.value = expected.length ? expected.join('\n') : 'No blanks.';
                });

                // ========== CHECK ANSWERS ==========
                checkBtn.addEventListener('click', checkAnswers);

                // ========== CONTINUE AFTER RECALL SUMMARY ==========
                continueAfterRecallBtn.addEventListener('click', () => {
                    recallSummaryModal.classList.add('hidden');
                    if (currentTermsIndices.length === 0) {
                        // all correct, go to reveal?
                        phase = 'reveal';
                    } else {
                        phase = 'initial';
                    }
                    renderQuiz();
                    saveSession();
                });

                // ========== FINISH ==========
                finishBtn.addEventListener('click', async () => {
                    await savePersistentData(currentFileIdentifier);
                    const wrongInSession = currentTermsIndices.filter(idx => wrongIndicesGlobal.has(idx)).length;
                    const correctCount = sessionTotalCount - wrongInSession;
                    summaryText.innerText = `${currentLesson.title}\nYou got ${correctCount} out of ${sessionTotalCount} correct.`;
                    summaryModal.classList.remove('hidden');
                });

                summaryOkBtn.addEventListener('click', () => {
                    summaryModal.classList.add('hidden');
                    quizScreen.classList.add('hidden');
                    welcomeScreen.classList.remove('hidden');
                    topBarWelcome.style.display = 'flex';
                    topBarQuiz.style.display = 'none';
                });

                // ========== BACK ==========
                backBtn.addEventListener('click', () => {
                    quizScreen.classList.add('hidden');
                    welcomeScreen.classList.remove('hidden');
                    topBarWelcome.style.display = 'flex';
                    topBarQuiz.style.display = 'none';
                });

                // ========== RESET WRONG ==========
                resetWrongBtn.addEventListener('click', async () => {
                    if (!currentFileIdentifier) return;
                    if (confirm('Delete all wrong answers for this lesson combination?')) {
                        wrongIndicesGlobal.clear();
                        correctStreakMap.clear();
                        await savePersistentData(currentFileIdentifier);
                        updateWrongWarning();
                    }
                });

                // ========== START QUIZ ==========
                startBtn.addEventListener('click', async () => {
                    if (!currentLesson) {
                        alert('No lesson loaded. Please select a file first.');
                        return;
                    }
                    let pool = onlyWrongCheck.checked && wrongIndicesGlobal.size > 0
                        ? Array.from(wrongIndicesGlobal).filter(i => i < currentLesson.terms.length)
                        : currentLesson.terms.map((_, i) => i);
                    if (pool.length === 0) { alert('No terms available'); return; }
                    const count = Math.min(parseInt(termCountInput.value), pool.length);
                    const shuffled = [...pool].sort(() => Math.random() - 0.5);
                    currentTermsIndices = shuffled.slice(0, count);
                    phase = 'recall';
                    renderQuiz();
                    quizScreen.classList.remove('hidden');
                    welcomeScreen.classList.add('hidden');
                    topBarWelcome.style.display = 'none';
                    topBarQuiz.style.display = 'flex';
                    saveSession();
                });

                // ========== FILE LOADING ==========
                fileInput.addEventListener('change', async (e) => {
                    const files = Array.from(e.target.files);
                    if (files.length === 0) return;
                    fileLoading.classList.remove('hidden');
                    let allTerms = [];
                    let mainTitle = 'Combined lesson';
                    let fileIdentifier = '';
                    const fileNames = [];
                    const allErrors = [];

                    for (let file of files) {
                        const content = await file.text();
                        fileNames.push(file.name);
                        fileIdentifier += file.name + '_' + file.size + '_';
                        const { lesson, errors } = parseLessonFromText(content, file.name);
                        allErrors.push(...errors);
                        if (lesson && lesson.terms.length > 0) {
                            allTerms = allTerms.concat(lesson.terms);
                            if (lesson.title !== 'Untitled' && mainTitle === 'Combined lesson') {
                                mainTitle = lesson.title;
                            }
                        }
                    }

                    fileLoading.classList.add('hidden');
                    if (allErrors.length > 0) {
                        errorList.innerHTML = allErrors.map(e => `<div>⚠️ ${escapeHTML(e)}</div>`).join('');
                        errorModal.classList.remove('hidden');
                    }

                    if (allTerms.length === 0) {
                        alert('No valid terms found.');
                        return;
                    }

                    const lesson = { title: mainTitle, terms: allTerms };
                    const identifier = fileIdentifier + 'mode_files';
                    cacheLesson(lesson, identifier, fileNames);
                    await loadLesson(lesson, identifier, fileNames);
                });

                // ========== PASTE MODAL ==========
                openPasteModalBtn.addEventListener('click', () => {
                    pasteContent.value = '';
                    pasteModal.classList.remove('hidden');
                });
                cancelPasteBtn.addEventListener('click', () => pasteModal.classList.add('hidden'));
                importPasteBtn.addEventListener('click', async () => {
                    const text = pasteContent.value.trim();
                    if (!text) { alert('Please paste some content.'); return; }
                    try {
                        const { lesson, errors } = parseLessonFromText(text, 'pasted.txt');
                        if (errors.length > 0) {
                            errorList.innerHTML = errors.map(e => `<div>⚠️ ${escapeHTML(e)}</div>`).join('');
                            errorModal.classList.remove('hidden');
                        }
                        if (!lesson || !lesson.terms.length) {
                            alert('No valid terms found. Check the error modal for details.');
                            return;
                        }
                        const identifier = 'pasted_' + Date.now();
                        cacheLesson(lesson, identifier, []);
                        await loadLesson(lesson, identifier, []);
                        pasteModal.classList.add('hidden');
                    } catch (e) {
                        console.error('Import error:', e);
                        alert('An unexpected error occurred while importing.');
                    }
                });

                // ========== LOAD LESSON HELPER ==========
                async function loadLesson(lesson, identifier, fileNames) {
                    if (!lesson || !lesson.terms.length) {
                        alert('No valid terms found.');
                        return false;
                    }
                    currentLesson = lesson;
                    currentFileIdentifier = identifier;

                    // Load persistent data – but don't break if it fails
                    try {
                        await loadPersistentData(identifier);
                    } catch (e) {
                        console.warn('Failed to load persistent data, starting fresh.', e);
                        wrongIndicesGlobal = new Set();
                        correctStreakMap = new Map();
                    }

                    const totalTerms = lesson.terms.length;
                    termCountInput.max = totalTerms;
                    termCountInput.value = Math.min(parseInt(termCountInput.value) || 20, totalTerms);
                    if (totalTerms < 10) termCountInput.min = 1;
                    startBtn.disabled = false;
                    console.log('Start button enabled'); // debug

                    if (fileNames.length > 0) {
                        fileListDiv.innerHTML = fileNames.map(n => `📄 ${n}`).join('<br>');
                    } else {
                        fileListDiv.innerHTML = '📋 pasted content';
                    }
                    updateWrongWarning();
                    return true;
                }

                function updateWrongWarning() {
                    if (onlyWrongCheck.checked && wrongIndicesGlobal.size === 0 && currentLesson) {
                        wrongWarning.classList.remove('hidden');
                    } else {
                        wrongWarning.classList.add('hidden');
                    }
                }
