<!DOCTYPE html>
<html>
  <head>
    <title>Animated Text</title>
    <style>
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
     

    <h1 style="animation: fadeIn 1s ease-in-out">Animated Text</h1>
  </body>
</html>
