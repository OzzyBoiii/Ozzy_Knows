    <script>
        // Window toggle functions
        function toggleWindow(windowId) {
            const windowToToggle = document.getElementById(windowId);
            windowToToggle.classList.toggle('active');
            document.body.style.overflow = windowToToggle.classList.contains('active') ? 'hidden' : '';
            if(windowToToggle.classList.contains('active')) {
                resetAllZooms();
            }
        }

        // Updated layout cycling function
        function cycleLayout(windowId) {
            const window = document.getElementById(windowId);
            const currentLayout = window.classList.contains('no-images') ? 'no-images' : 
                                 window.classList.contains('swapped') ? 'swapped' : 'default';
            
            // Reset all classes first
            window.classList.remove('no-images', 'swapped');
            
            // Cycle through layouts
            if (currentLayout === 'default') {
                window.classList.add('swapped');
            } 
            else if (currentLayout === 'swapped') {
                window.classList.add('no-images');
            } 
            else {
                // Goes back to default
            }
        }

        // Zoom and pan functionality
        let imageScales = {};
        let textScales = {};
        let isDragging = false;
        let startPos = { x: 0, y: 0 };
        let scrollPos = { x: 0, y: 0 };
        let currentImageId = null;

        function resetAllZooms() {
            const images = document.querySelectorAll('.zoomable-image');
            images.forEach(img => {
                img.style.transform = 'scale(1)';
                imageScales[img.id] = 1;
                img.parentElement.scrollTo(0, 0);
            });
            
            const textElements = document.querySelectorAll('.zoomable-text');
            textElements.forEach(text => {
                text.style.fontSize = '1em';
                textScales[text.closest('.newWindow').id] = 1;
                text.parentElement.scrollTo(0, 0);
            });
        }

        function zoomIn(imageId) {
            if (!imageScales[imageId]) imageScales[imageId] = 1;
            imageScales[imageId] += 0.1;
            const image = document.getElementById(imageId);
            image.style.transform = `scale(${imageScales[imageId]})`;
        }

        function zoomOut(imageId) {
            if (!imageScales[imageId]) imageScales[imageId] = 1;
            imageScales[imageId] = Math.max(0.5, imageScales[imageId] - 0.1);
            const image = document.getElementById(imageId);
            image.style.transform = `scale(${imageScales[imageId]})`;
        }

        function resetZoom(imageId) {
            imageScales[imageId] = 1;
            const image = document.getElementById(imageId);
            image.style.transform = 'scale(1)';
            image.parentElement.scrollTo(0, 0);
        }

        function zoomInText(windowId) {
            if (!textScales[windowId]) textScales[windowId] = 1;
            textScales[windowId] += 0.1;
            document.querySelectorAll(`#${windowId} .zoomable-text`).forEach(text => {
                text.style.fontSize = `${textScales[windowId]}em`;
            });
        }

        function zoomOutText(windowId) {
            if (!textScales[windowId]) textScales[windowId] = 1;
            textScales[windowId] = Math.max(0.5, textScales[windowId] - 0.1);
            document.querySelectorAll(`#${windowId} .zoomable-text`).forEach(text => {
                text.style.fontSize = `${textScales[windowId]}em`;
            });
        }

        function resetZoomText(windowId) {
            textScales[windowId] = 1;
            document.querySelectorAll(`#${windowId} .zoomable-text`).forEach(text => {
                text.style.fontSize = '1em';
                text.parentElement.scrollTo(0, 0);
            });
        }

        // Image panning functionality
        document.addEventListener('mousedown', (e) => {
            if (e.target.closest('.image-display')) {
                isDragging = true;
                startPos = {
                    x: e.clientX,
                    y: e.clientY
                };
                const container = e.target.closest('.image-display');
                scrollPos = {
                    x: container.scrollLeft,
                    y: container.scrollTop
                };
                container.style.cursor = 'grabbing';
                currentImageId = container.querySelector('img').id;
                e.preventDefault();
            }
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            
            const dx = e.clientX - startPos.x;
            const dy = e.clientY - startPos.y;
            
            const container = document.querySelector(`#${currentImageId}`).parentElement;
            container.scrollLeft = scrollPos.x - dx;
            container.scrollTop = scrollPos.y - dy;
            
            e.preventDefault();
        });

        document.addEventListener('mouseup', () => {
            isDragging = false;
            const containers = document.querySelectorAll('.image-display');
            containers.forEach(container => {
                container.style.cursor = 'grab';
            });
            currentImageId = null;
        });

        // Scroll lock functions
        function lockA() {
            var xPos = window.scrollX;
            var yPos = window.scrollY;
            window.onscroll = () => window.scroll(xPos, yPos);
        }

        function unlock() {
            window.onscroll = "";
        }

        // Scroll reveal animation
        function reveal() {
            var reveals = document.querySelectorAll(".reveal");
            for (var i = 0; i < reveals.length; i++) {
                var windowHeight = window.innerHeight;
                var elementTop = reveals[i].getBoundingClientRect().top;
                var elementVisible = 150;
                if (elementTop < windowHeight - elementVisible) {
                    reveals[i].classList.add("active");
                } else {
                    reveals[i].classList.remove("active");
                }
            }
        }
        window.addEventListener("scroll", reveal, { passive: true });
        reveal(); // Initialize

        let direction = -1;
        data.filter(x => x.parentId === null).forEach(x => {
          x.div = direction; 
          direction *= -1;
        });
        const root = data.find(x => x.id === null);
        if (root) root.div = 0;
        data.filter(x => x.parentId !== null).forEach(x => {
          x.div = calculateDepth(x.id) * (x.div || 1);
        });
        const divs = [...new Set(data.map(x => x.div))].sort((a, b) => a - b);
        divs.forEach(div => {
          $(`#${config.containerId}`).append('div').id(`div${div}`).addClass('f-col');
        });
        data.forEach(node => {
          const parentDiv = $(`#div${node.div}`);
          if (parentDiv.n) {
            parentDiv.append('p')
            .html(node.text)
            .id(`p${node.id}`)
            .addClass(config.nodeClasses);
          }
        });
      }
      /**/
      /**/
      /* Draw connecting lines*/
      function drawLines(data) {
        const container = $(`#${config.containerId}`).n;
        if (!container) return;
        const rect = container.getBoundingClientRect();
        const svg = $().sCreate(`0 0 ${rect.width} ${rect.height}`)
        .id(config.svgId)
        .insertAfter($('h1'));
        svg.n.style = `top:${rect.top}px;left:${rect.left}px; width:${rect.width}px;height:${rect.height}px;`;
        /* Updated filter to include nodes with parentId: null*/
        data.filter(x => x.parentId !== undefined).forEach(node => {
          const nodeEl = $(`#p${node.id}`).n;
          const parentEl = $(`#p${node.parentId}`).n;
          if (!nodeEl || !parentEl) return;
          const parentRect = parentEl.getBoundingClientRect(); // Parent is the start point
          const nodeRect = nodeEl.getBoundingClientRect(); // Child is the end point
          const startX = parentRect.left - rect.left + (parentRect.width / 2);
          const startY = parentRect.top - rect.top + parentRect.height;
          const endX = nodeRect.left - rect.left + (nodeRect.width / 2);
          const endY = nodeRect.top - rect.top;
          svg.sAppend(
            $().sBezier(startX, startY, endX, endY)
            .addClass('path')
            .stroke('var(--secondary-color)')
            .strokeWidth('var(--stroke-width)')
          );
        });
      }
      /**/
      /**/
      /* Sample data*/
      const data = [
        { id: null, text: "<b>Test<br>Mind Map</b>" },
        { id: 1, parentId: null, text: "Idea - 1" },
        { id: 2, parentId: null, text: "Dr. Helmut Zimmermann" },
        { id: 3, parentId: null, text: "Idea - 3" },
        { id: 4, parentId: 1, text: "order Cake and <b>Coffee</b>" },
        { id: 5, parentId: 1, text: "Idea - 1 - 2 " },
        { id: 6, parentId: 3, text: "Idea - 3 - 1 " },
        { id: 7, parentId: 3, text: "Idea- 3 - 2" },
        { id: 10, parentId: 2, text: "Idea - 2 - 1" },
        { id: 12, parentId: 2, text: "Idea - 2 - 2" },
        { id: 13, parentId: 3, text: "Idea- 3 - 5"},
      ];
      /**/
      /**/
      /* Initialize*/
      createMap(data);
      drawLines(data);
      resizeObserver.observe($(`#${config.containerId}`).n);
      /*EXAMPLE WINDOW*/

      /* Function to slide to the next window*/
      function slideNext(containerId) {
        const container = document.getElementById(containerId);
        const slider = container.querySelector('.slider');
        const totalWindows = slider.children.length;
        let currentWindow = parseInt(container.dataset.currentWindow || 0);
        if (currentWindow < totalWindows - 1) {
          currentWindow++;
          updateSlider(container, slider, currentWindow);
          updateButtons(container, currentWindow, totalWindows);
        }
      }
      /**/
      /**/
      /* Function to slide to the previous window*/
      function slidePrevious(containerId) {
        const container = document.getElementById(containerId);
        const slider = container.querySelector('.slider');
        const totalWindows = slider.children.length;
        let currentWindow = parseInt(container.dataset.currentWindow || 0);
        if (currentWindow > 0) {
          currentWindow--;
          updateSlider(container, slider, currentWindow);
          updateButtons(container, currentWindow, totalWindows);
        }
      }
      /**/
      /**/
      /* Function to update the slider's position*/
      function updateSlider(container, slider, currentWindow) {
        const translateX = -(currentWindow * 100);
        slider.style.transform = `translateX(${translateX}%)`;
        ontainer.dataset.currentWindow = currentWindow; // Store current window index
      }
      /**/
      /**/
      /* Function to update button states*/
      function updateButtons(container, currentWindow, totalWindows) {
        const prevButton = container.nextElementSibling.querySelector('.slide-button:first-of-type');
        const nextButton = container.nextElementSibling.querySelector('.slide-button:last-of-type');
        prevButton.disabled = currentWindow === 0; // Disable "Previous" on first window
        nextButton.disabled = currentWindow === totalWindows - 1; // Disable "Next" on last window
      }
      /**/
      /**/
      // Initialize button states for all containers
      document.querySelectorAll('.container').forEach(container => {
        const slider = container.querySelector('.slider');
        const totalWindows = slider.children.length;
        updateButtons(container, 0, totalWindows); /* Start at the first window*/
      });
