<!DOCTYPE html>
<html>
  <head>
    <title>Relaxing</title>
  </head>
  <body>
    <h1>Welcome to My Website!</h1>
    <p>This website has background music.</p>

    <audio id="myAudio" controls autoplay loop>
      <source src="Alone_-_Color_Out.mp3" type="audio/mpeg" />
      Your browser does not support the audio element.
    </audio>

    <button onclick="playPause()">Play/Pause Music</button>

    <script>
      const audio = document.getElementById("myAudio");

      function playPause() {
        if (audio.paused) {
          audio.play();
        } else {
          audio.pause();
        }
      }
    </script>
  </body>
</html>
