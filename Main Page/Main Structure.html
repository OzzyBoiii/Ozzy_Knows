            border: 1px solid black;
            display: none;

    <script>
        // MODIFIED ZOOM FUNCTIONS
        const imageScales = {};

        function zoomIn() {
            document.querySelectorAll('.newWindow.active .zoomable-image').forEach(img => {
                const imgId = img.dataset.id || 'default';
                imageScales[imgId] = (imageScales[imgId] || 1) + 0.1;
                img.style.transform = `scale(${imageScales[imgId]})`;
            });
        }

        function zoomOut() {
            document.querySelectorAll('.newWindow.active .zoomable-image').forEach(img => {
                const imgId = img.dataset.id || 'default';
                imageScales[imgId] = Math.max(0.5, (imageScales[imgId] || 1) - 0.1);
                img.style.transform = `scale(${imageScales[imgId]})`;
            });
        }

        function resetZoom() {
            document.querySelectorAll('.newWindow.active .zoomable-image').forEach(img => {
                const imgId = img.dataset.id || 'default';
                imageScales[imgId] = 1;
                img.style.transform = 'scale(1)';
            });
        }

        // TOGGLE IMAGE SIDE - now properly swaps positions
        function toggleImageSide() {
            document.querySelectorAll('.newWindow').forEach(window => {
                window.classList.toggle('image-right');

        function toggleWindow(windowId) {
            const windowToToggle = document.getElementById(windowId);
            windowToToggle.classList.toggle('active');
            document.body.style.overflow = windowToToggle.classList.contains('active') ? 'hidden' : '';

            }
        }

         /*MINDMAP SETTINGS*/
      /*MINDMAP SETTINGS*/
      /*MINDMAP SETTINGS*/
      /*MINDMAP SETTINGS*/
      "use strict";
      /* Configuration object*/
      const config = {
        containerId: 'container',
        svgId: 'mindmap-svg',
        nodeClasses: 'mindmap-node',
        curveIntensity: 0.5,
        layoutDirection: 'horizontal',
        initialMinWidth: 600
      };
      /**/
      /**/
      /* Debounce function*/
      const debounce = (func, wait) => {
        let timeout;
        return (...args) => {
          clearTimeout(timeout);
          timeout = setTimeout(() => func.apply(this, args), wait);
        };
      };
      /**/
      /**/
      /* Helper function*/
      const $ = function(t = null) {
        return new class {
          constructor(t) {
            if (t) {
              this.nodes = t.nodeType ? [t] 
              : NodeList.prototype.isPrototypeOf(t) ? t 
              : document.querySelectorAll(t);
              this.n = this.nodes[0];
            }
          }
          each = t => (this.nodes.forEach(s => t(s)), this);
          addClass = t => this.each(s => s.classList.add(...t.split(",").map(c => c.trim())));
          html = t => this.each(s => s.innerHTML = t);
          create = t => $(document.createElement(t));
          append = t => {
            let s = this.create(t);
            this.n.appendChild(s.n);
            return s;
          };
          remove = () => this.each(node => node.remove());
          insertAfter = t => (t.n.after(this.n), this);
          setAttr = (t, s = "") => this.each(e => e.setAttribute(t, s));
          sCreate = t => {
            let s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
            s.setAttributeNS("http://www.w3.org/2000/xmlns/", "xmlns:xlink", "http://www.w3.org/1999/xlink");
            s.setAttribute("viewBox", t);
            return $(s);
          };
          sAppend = t => (this.n.appendChild(t.n), this);
          sC = t => document.createElementNS("http://www.w3.org/2000/svg", t);
          id = t => (this.setAttr("id", t), this);
          d = t => (this.setAttr("d", t), this);
          stroke = t => (this.setAttr("stroke", t), this);
          strokeWidth = t => (this.setAttr("stroke-width", t), this);
          sBezier = (x1, y1, x2, y2) => {
            const path = this.sC("path");
            const midX = (x1 + x2) / 2;
            return $(path).d(`M${x1},${y1} C ${midX},${y1} ${midX},${y2} ${x2},${y2}`);
          };
        }(t);
      };
      /**/
      /**/
      /* Resize observer*/
      const resizeObserver = new ResizeObserver(debounce(() => {
        $(`#${config.svgId}`).remove();
        drawLines(data);
      }, 100));
      /**/
      /**/
      /* Create mind map structure*/
      function createMap(data) {
        function calculateDepth(id, depth = 0) {
          let current = data.find(x => x.id === id);
          while (current?.parentId !== undefined) {
            depth++;
            current = data.find(x => x.id === current.parentId);
          }
          return depth;
        }
        let direction = -1;
        data.filter(x => x.parentId === null).forEach(x => {
          x.div = direction; 
          direction *= -1;
        });
        const root = data.find(x => x.id === null);
        if (root) root.div = 0;
        data.filter(x => x.parentId !== null).forEach(x => {
          x.div = calculateDepth(x.id) * (x.div || 1);
        });
        const divs = [...new Set(data.map(x => x.div))].sort((a, b) => a - b);
        divs.forEach(div => {
          $(`#${config.containerId}`).append('div').id(`div${div}`).addClass('f-col');
        });
        data.forEach(node => {
          const parentDiv = $(`#div${node.div}`);
          if (parentDiv.n) {
            parentDiv.append('p')
            .html(node.text)
            .id(`p${node.id}`)
            .addClass(config.nodeClasses);
          }
        });
      }
      /**/
      /**/
      /* Draw connecting lines*/
      function drawLines(data) {
        const container = $(`#${config.containerId}`).n;
        if (!container) return;
        const rect = container.getBoundingClientRect();
        const svg = $().sCreate(`0 0 ${rect.width} ${rect.height}`)
        .id(config.svgId)
        .insertAfter($('h1'));
        svg.n.style = `top:${rect.top}px;left:${rect.left}px; width:${rect.width}px;height:${rect.height}px;`;
        /* Updated filter to include nodes with parentId: null*/
        data.filter(x => x.parentId !== undefined).forEach(node => {
          const nodeEl = $(`#p${node.id}`).n;
          const parentEl = $(`#p${node.parentId}`).n;
          if (!nodeEl || !parentEl) return;
          const parentRect = parentEl.getBoundingClientRect(); // Parent is the start point
          const nodeRect = nodeEl.getBoundingClientRect(); // Child is the end point
          const startX = parentRect.left - rect.left + (parentRect.width / 2);
          const startY = parentRect.top - rect.top + parentRect.height;
          const endX = nodeRect.left - rect.left + (nodeRect.width / 2);
          const endY = nodeRect.top - rect.top;
          svg.sAppend(
            $().sBezier(startX, startY, endX, endY)
            .addClass('path')
            .stroke('var(--secondary-color)')
            .strokeWidth('var(--stroke-width)')
          );
        });
      }
      /**/
      /**/
      /* Sample data*/
      const data = [
        { id: null, text: "<b>Test<br>Mind Map</b>" },
        { id: 1, parentId: null, text: "Idea - 1" },
        { id: 2, parentId: null, text: "Dr. Helmut Zimmermann" },
        { id: 3, parentId: null, text: "Idea - 3" },

        { id: 5, parentId: 1, text: "Idea - 1 - 2 " },
        { id: 6, parentId: 3, text: "Idea - 3 - 1 " },
        { id: 7, parentId: 3, text: "Idea- 3 - 2" },
        { id: 10, parentId: 2, text: "Idea - 2 - 1" },
        { id: 12, parentId: 2, text: "Idea - 2 - 2" },
        { id: 13, parentId: 3, text: "Idea- 3 - 5"},
      ];
      /**/
      /**/
      /* Initialize*/
      createMap(data);
      drawLines(data);
      resizeObserver.observe($(`#${config.containerId}`).n);

      /* Function to slide to the next window*/
      function slideNext(containerId) {
        const container = document.getElementById(containerId);
        const slider = container.querySelector('.slider');
        const totalWindows = slider.children.length;
        let currentWindow = parseInt(container.dataset.currentWindow || 0);
        if (currentWindow < totalWindows - 1) {
          currentWindow++;
          updateSlider(container, slider, currentWindow);
          updateButtons(container, currentWindow, totalWindows);
        }
      }
      /**/
      /**/
      /* Function to slide to the previous window*/
      function slidePrevious(containerId) {
        const container = document.getElementById(containerId);
        const slider = container.querySelector('.slider');
        const totalWindows = slider.children.length;
        let currentWindow = parseInt(container.dataset.currentWindow || 0);
        if (currentWindow > 0) {
          currentWindow--;
          updateSlider(container, slider, currentWindow);
          updateButtons(container, currentWindow, totalWindows);
        }
      }
      /**/
      /**/
      /* Function to update the slider's position*/
      function updateSlider(container, slider, currentWindow) {
        const translateX = -(currentWindow * 100);
        slider.style.transform = `translateX(${translateX}%)`;
        ontainer.dataset.currentWindow = currentWindow; // Store current window index
      }
      /**/
      /**/
      /* Function to update button states*/
      function updateButtons(container, currentWindow, totalWindows) {
        const prevButton = container.nextElementSibling.querySelector('.slide-button:first-of-type');
        const nextButton = container.nextElementSibling.querySelector('.slide-button:last-of-type');
        prevButton.disabled = currentWindow === 0; // Disable "Previous" on first window
        nextButton.disabled = currentWindow === totalWindows - 1; // Disable "Next" on last window
      }
      /**/
      /**/
      // Initialize button states for all containers
      document.querySelectorAll('.container').forEach(container => {
        const slider = container.querySelector('.slider');
        const totalWindows = slider.children.length;
        updateButtons(container, 0, totalWindows);
      });
    </script>
</body>
